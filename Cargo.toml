# Flyff V15 rewrite: virtual workspace manifest (Plan/02 §2.1).
# Versions are resolved against the crates.io index at bootstrap (WP-CORE-01) and recorded in
# docs/adr/ADR-017-workspace-and-toolchain.md. `Cargo.lock` is committed.
[workspace]
resolver = "3"
members = ["crates/*", "tools/npcscript-transpile", "tools/proto-coverage", "xtask"]
default-members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0-dev"      # Plan/02 §8.7: 0.<n>.0-dev while current_milestone = M<n>
edition = "2024"
rust-version = "1.99"      # == rust-toolchain.toml channel
publish = false
license = "Apache-2.0"
repository = "https://github.com/Laarm/FlyffRewriteRust"

# Plan/02 §11.2
[workspace.lints.rust]
unsafe_code = "deny"                 # crates needing unsafe add #![allow(unsafe_code)] + justification in lib.rs
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"                 # CI uses -D warnings => effectively deny outside tests
print_stdout = "warn"                # use tracing; flyff-server CLI output, xtask, tools allow at crate level
print_stderr = "warn"
iter_over_hash_type = "warn"
large_stack_arrays = "warn"

# Plan/02 §2.2: the ONLY place third-party versions are written.
[workspace.dependencies]
# ---- internal ----
flyff-common  = { path = "crates/flyff-common" }
flyff-vfs     = { path = "crates/flyff-vfs" }
flyff-script  = { path = "crates/flyff-script" }
flyff-data    = { path = "crates/flyff-data" }
flyff-formats = { path = "crates/flyff-formats" }
flyff-rules   = { path = "crates/flyff-rules" }
flyff-sim     = { path = "crates/flyff-sim" }
flyff-proto   = { path = "crates/flyff-proto" }
flyff-db      = { path = "crates/flyff-db" }
flyff-game    = { path = "crates/flyff-game" }
flyff-lua     = { path = "crates/flyff-lua" }
flyff-assets  = { path = "crates/flyff-assets" }

# ---- async / net (native only; tokio and friends only in flyff-server and flyff-e2e, rule X1) ----
tokio         = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-util    = "0.7"
axum          = { version = "0.8", features = ["ws", "http1", "http2", "tokio"] }
tower         = "0.5"
hyper         = "1.12"
hyper-util    = "0.1"
http-body-util = "0.1"
axum-server   = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
rustls        = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2"
futures-util  = "0.3"
async-trait   = "0.1"        # `LobbyPort` (a dyn-compatible async trait, Plan/10 §7.3); already in the lock file
bytes         = "1.12"
flume         = "0.12"          # the only inter-thread channel crate (01 ADR-010)
parking_lot   = "0.12"

# ---- data / serialization ----
serde         = { version = "1", features = ["derive"] }
serde_json    = { version = "1", features = ["float_roundtrip"] }   # also in the wasm graph (§11.5 rule 2)
toml          = "1.1"
prost         = "0.14"
prost-types   = "0.14"
prost-build   = "0.14"          # xtask only
prost-reflect = "0.16"          # xtask + proto-coverage only
encoding_rs   = "0.8"
base64        = "0.23"

# ---- persistence / scripting (decided by D2/D5; 13 picks the migration crate) ----
rusqlite      = { version = "0.40", features = ["bundled", "backup"] }
mlua          = { version = "0.12", features = ["lua53", "vendored"] }

# ---- cli / logging / errors ----
clap          = { version = "4.6", features = ["derive"] }
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2"
thiserror     = "2"
anyhow        = "1"

# ---- collections / determinism ----
slotmap       = "1"
indexmap      = "2"
smallvec      = { version = "1.16", features = ["union", "const_generics"] }
rustc-hash    = "2"
rand_core     = { version = "0.10", default-features = false }
rand_pcg      = { version = "0.10", default-features = false }
getrandom     = "0.4"           # native only (OS entropy)
libm          = "0.2"
glam          = { version = "0.34", default-features = false, features = ["libm", "scalar-math"] }   # D4

# ---- crypto / hashing ----
argon2        = "0.6"
md-5          = "0.11"
sha2          = "0.11"
sha1          = "0.10"        # the TOTP HMAC-SHA1 of the admin console (25 §1.3, WP-ADMIN-28); 0.10 is the digest-0.10 line axum/tungstenite already use
qrcode        = { version = "0.14", default-features = false, features = ["svg"] }   # the TOTP setup QR (server-side SVG; WP-ADMIN-28)
blake3        = "1"
xxhash-rust   = { version = "0.8", features = ["xxh3"] }

# ---- time zones (10 §5.5: the single tz stack; ADR-017) ----
chrono        = { version = "0.4", default-features = false, features = ["std"] }   # no `clock`
chrono-tz     = "0.10"
iana-time-zone = "0.1"

# ---- assets / web ----
rust-embed    = { version = "8.13", features = ["include-exclude", "interpolate-folder-path"] }
mime_guess    = "2"
flate2        = "1"             # miniz_oxide backend (pure Rust)
png           = "0.18"          # flyff-assets only: deterministic PNG encoding of the `png`/`cursor` kinds (Plan/24 §10.2)
mimalloc      = { version = "0.1", default-features = false }
rustix        = { version = "1", features = ["process"] }   # thread nice level for the asset pool (safe wrapper)
libc          = "0.2"           # flyff-assets only: ioprio_set(2) for the asset pool (Plan/24 §7.4, §23); already transitive

# ---- wasm (exact pin of wasm-bindgen is mandatory, D8: the installed wasm-bindgen-cli is 0.2.129) ----
wasm-bindgen  = "=0.2.129"
js-sys        = "0.3"
serde-wasm-bindgen = "0.6"      # flyff-wasm only
console_error_panic_hook = "0.1"

# ---- testing ----
tempfile      = "3"

# ---- tooling (xtask / tools) ----
walkdir       = "2"
heck          = "0.5"           # xtask gen-proto: the identifier conversion prost-build uses
object        = { version = "0.40", default-features = false, features = ["read", "elf", "std"] }
notify        = "8"
regex         = "1"
semver        = "1"
ts-rs         = "12"
schemars      = "1"

# Plan/02 §2.4
[profile.dev]
debug = "limited"

[profile.dev.package."*"]          # dependencies optimized so dev servers/tests are usable
opt-level = 2
debug = false

[profile.fasttest]                 # corpus/e2e tests, `xtask dev` server: fast but checked
inherits = "dev"
opt-level = 2
debug = "line-tables-only"
debug-assertions = true
overflow-checks = true

[profile.release]                  # glibc dev/perf builds
opt-level = 3
lto = "thin"
debug = "line-tables-only"
incremental = false
# panic: default "unwind" is REQUIRED (D2 catch_unwind). Never set panic = "abort" here.

[profile.dist]                     # the shipped musl binary
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = "debuginfo"                # keep the symbol table: panic backtraces show function names

[profile.wasm-release]             # every wasm32 build that ships or is determinism-tested
inherits = "release"
panic = "abort"
lto = "fat"
codegen-units = 1
debug = false
strip = "debuginfo"
opt-level = "s"                    # size-optimised (Plan/02 §8.8 wasm budget)
