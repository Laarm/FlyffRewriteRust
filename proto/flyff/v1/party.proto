    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x8C
    name: "PARTYSKILL_RETREAT"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M5";
}

// legacy PARTYSKILL_SPHERECIRCLE 0x008E (S2C); obj_id: the leader's target. Party skill Sphere Circle (ref/08
// section 13.1, Plan/21 section 4.8). No payload.
message PartySkillSphereCircle {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x8E
    name: "PARTYSKILL_SPHERECIRCLE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M5";
}

// legacy SETPARTYMODE 0x008D (S2C); obj_id: 0 (self). A party mode timer started, ran out or was reset (ref/08
// section 13.1, ref/09a section 5.7, Plan/21 section 4.8).
message SetPartyMode {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x8D
    name: "SETPARTYMODE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M5";
  // party mode 0..4 (see the file header)
  sint32 mode = 1 [(flyff.legacy_type) = "i32 mode"];
  // remaining mode time in milliseconds
  uint32 time_ms = 2 [(flyff.legacy_type) = "u32 skillTime"];
  // true = the mode is running
  bool on = 3 [(flyff.legacy_type) = "BOOL bOn"];
  // party points after the cost; 0 when the mode is off
  sint32 point = 4 [(flyff.legacy_type) = "i32 point (only iff bOn)"];
}

// legacy SET_PARTY_MEMBER_PARAM 0x0091 (S2C); obj_id: 0 (self). A member parameter changed; the only parameter
