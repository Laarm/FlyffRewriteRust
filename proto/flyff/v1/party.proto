  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M5";
  // the party name
  string name = 1 [(flyff.legacy_type) = "str<=33"];
}

// legacy PARTYCHANGENAME 0x0089 (S2C); obj_id: 0 (self). The party was renamed (ref/08 section 13.1, ref/09a
// section 5.7).
message PartyChangeName {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x89
    name: "PARTYCHANGENAME"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M5";
  // the party name
  string name = 1 [(flyff.legacy_type) = "str<=33"];
}

// legacy PARTYSKILL_CALL 0x008A (S2C); obj_id: 0 (self). Party skill Call: the effect points toward the leader
// (ref/08 section 13.1, Plan/21 section 4.8).
message PartySkillCall {
  option (flyff.legacy_id) = {
