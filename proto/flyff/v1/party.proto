    name: "PARTYSKILL_CALL"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M5";
  Vec3 leader_pos = 1 [(flyff.legacy_type) = "vec3 leaderPos"];
}

// legacy PARTYSKILL_BLITZ 0x008B (S2C); obj_id: 0 (self). Party skill Blitz: the target of the leader (ref/08
// section 13.1, Plan/21 section 4.8).
message PartySkillBlitz {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x8B
    name: "PARTYSKILL_BLITZ"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
