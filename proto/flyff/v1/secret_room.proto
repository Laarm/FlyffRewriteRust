// Secret room messages (Plan/11 section 4.2, WP-PROTO-26; tag block 912-943): the guild bidding for the continent
// dungeons. Transcribed from ref/07c section 20, ref/08 section 15.3, ref/09b section 3.16, src:WORLDSERVER/User.cpp
// (AddSecretRoom*) and Plan/22 section 11. SecretRoomMngState.state carries the manager states SRMNG_CLOSE 1,
// OPEN 2, LINEUP 3, ENTRANCE 4, WARWAIT 5, WAR 6 and the continent states SRCONT_CLOSE 101, OPEN 102, WAR 103,
// CLOSEWAIT 104 (SecretRoom.h:16-17); the client shows a timer for 3 (masters only), 5, 103, 104. War states:
// FAILED 0, NORMAL 1, MIDBOSS 2, BOSS 3, WIN 4. Every C2S message acts for the session character (VR-001).
syntax = "proto3";

package flyff.v1;

import "flyff/options.proto";

// legacy SECRETROOM_TENDER 0x70000100 (C2S): bid penya for a continent's secret room (ref/07c section 20,
// Plan/22 section 11.2). The guild master only, while bids are open; a bid of 0 or less is ignored.
message SecretRoomTender {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x70000100
    name: "SECRETROOM_TENDER"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
  // the bid in penya, at least the minimum, higher than the previous bid
  sint32 penya = 1 [(flyff.legacy_type) = "i32 nPenya"];
}

// legacy SECRETROOM_LINEUPMEMBER 0x70000101 (C2S): submit the line-up of the war (ref/07c section 20, Plan/22
// section 11.2). The guild master only, while the line-up is open; no duplicate ids.
message SecretRoomLineUpMember {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x70000101
    name: "SECRETROOM_LINEUPMEMBER"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
  // dropped: n (i32, the list length)
  // the line-up (character ids), at most the configured maximum
  repeated uint32 ids = 1 [
    (flyff.legacy_type) = "n x DWORD idPlayer",
    (flyff.max_len) = 80
  ];
}

// legacy SECRETROOM_TENDEROPENWND 0x70000102 (C2S): open the bid window (ref/07c section 20, Plan/22 section
// 11.2). No payload. Answer: SecretRoomTenderOpenWndNtf.
message SecretRoomTenderOpenWndReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x70000102
    name: "SECRETROOM_TENDEROPENWND"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
}

// legacy SECRETROOM_LINEUPOPENWND 0x70000103 (C2S): open the line-up window (ref/07c section 20, Plan/22
// section 11.2). No payload. Answer: SecretRoomLineUpOpenWndNtf.
message SecretRoomLineUpOpenWndReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x70000103
    name: "SECRETROOM_LINEUPOPENWND"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
}

// legacy SECRETROOM_ENTRANCE 0x70000104 (C2S): enter the secret room of the continent (ref/07c section 20,
// Plan/22 section 11.3). No payload.
message SecretRoomEntrance {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x70000104
    name: "SECRETROOM_ENTRANCE"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
}

// legacy SECRETROOM_TELEPORTTONPC 0x70000105 (C2S): go to the revival position of the player's side (ref/07c
// section 20, Plan/22 section 11.3). No payload.
message SecretRoomTeleportToNpc {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x70000105
    name: "SECRETROOM_TELEPORTTONPC"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
}

// legacy SECRETROOM_TENDERVIEW 0x70000106 (C2S): see the bid ranking (ref/07c section 20, Plan/22 section
// 11.2). No payload. Answer: SecretRoomTenderViewNtf.
message SecretRoomTenderViewReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x70000106
    name: "SECRETROOM_TENDERVIEW"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
}

// legacy SECRETROOM_TENDERCANCELRETURN 0x70000107 (C2S): withdraw the bid and get 80 percent back (ref/07c
// section 20, Plan/22 section 11.2). No payload.
message SecretRoomTenderCancelReturn {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x70000107
    name: "SECRETROOM_TENDERCANCELRETURN"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
}

// legacy SECRETROOM_TELEPORTTODUNGEON 0x70000114 (C2S): the owner guild enters the hunting ground (ref/07c
// section 20, Plan/22 section 11.4). No payload.
message SecretRoomTeleportToDungeon {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x70000114
    name: "SECRETROOM_TELEPORTTODUNGEON"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
}

// legacy SECRETROOM_TENDEROPENWND 0x0302 (S2C); obj_id: 0 (self). The bid window (ref/08 section 15.3, ref/09b
// section 3.16, Plan/22 section 11.2).
message SecretRoomTenderOpenWndNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x302
    name: "SECRETROOM_TENDEROPENWND"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
  sint32 min_penya = 1 [(flyff.legacy_type) = "i32"];
  // the guild's current bid, 0 = none
  sint32 my_tender = 2 [(flyff.legacy_type) = "i32"];
}

// legacy SECRETROOM_LINEUPOPENWND 0x0303 (S2C); obj_id: 0 (self). The line-up window (ref/08 section 15.3,
// ref/09b section 3.16, Plan/22 section 11.2).
message SecretRoomLineUpOpenWndNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x303
    name: "SECRETROOM_LINEUPOPENWND"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
  sint32 min_members = 1 [(flyff.legacy_type) = "i32"];
  sint32 max_members = 2 [(flyff.legacy_type) = "i32"];
  // dropped: n (u32, the list length)
  // the stored line-up (character ids)
  repeated uint32 ids = 3 [(flyff.legacy_type) = "n x u32"];
}

// legacy SECRETROOM_TENDERVIEW 0x0304 (S2C); obj_id: 0 (self). The bid ranking (ref/08 section 15.3, ref/09b
// section 3.16, Plan/22 section 11.2).
message SecretRoomTenderViewNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x304
    name: "SECRETROOM_TENDERVIEW"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
  sint32 my_penya = 1 [(flyff.legacy_type) = "i32 nTenderPenya"];
  // 1-based rank of the guild, 0 = none
  sint32 my_rank = 2 [(flyff.legacy_type) = "i32 nRanking"];
  // seconds until the next opening
  sint32 remain_s = 3 [(flyff.legacy_type) = "time_t t"];
  // dropped: n (u32, the list length)
  // bidding guilds in rank order
  repeated uint32 guilds = 4 [(flyff.legacy_type) = "n x u32 dwGuildId"];
}

// legacy SECRETROOM_MNG_STATE 0x0300 (S2C); obj_id: 0 (self). The manager state (ref/08 section 15.3, ref/09b
// section 3.16, Plan/22 section 11.3).
message SecretRoomMngState {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x300
    name: "SECRETROOM_MNG_STATE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
  // manager state (see the file header)
  sint32 state = 1 [(flyff.legacy_type) = "i32 nState"];
  // milliseconds left in the state
  uint32 remain_ms = 2 [(flyff.legacy_type) = "DWORD dwRemainTime"];
}

// legacy SECRETROOM_INFO 0x0301 (S2C); obj_id: 0 (self). A continent's war information (ref/08 section 15.3,
// ref/09b section 3.16, Plan/22 section 11.5). The legacy `u8 nType` selects the payload; the field number is
// nType + 1: GUILDLIST 1, KILLCOUNT 2, WARSTATE 3. The nested messages drop the SECRETROOM_ prefix.
message SecretRoomInfo {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x301
    name: "SECRETROOM_INFO"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
  uint32 continent = 1 [(flyff.legacy_type) = "u8 nContinent"];
  oneof sub {
    // SECRETROOM_GUILDLIST 1
    GuildList guild_list = 2;
    // SECRETROOM_KILLCOUNT 2
    KillCount kill_count = 3;
    // SECRETROOM_WARSTATE 3
    WarState war_state = 4;
  }

  // One bidding guild of the continent.
  message SecretRoomGuild {
    uint32 id_guild = 1 [(flyff.legacy_type) = "u32 dwGuildId"];
    sint32 war_state = 2 [(flyff.legacy_type) = "i32 nWarState"];
    sint32 kill_count = 3 [(flyff.legacy_type) = "i32 nKillCount"];
    // dropped: m (i32, the list length; only for the receiver's own guild)
    // the line-up of the receiver's guild (character ids); empty for other guilds
    repeated uint32 lineup = 4 [(flyff.legacy_type) = "m x u32 (own guild only)"];
  }

  // Kills needed in one war state.
  message SecretRoomMonsterTotal {
    // the war state (the key of the legacy map)
    sint32 war_state = 1 [(flyff.legacy_type) = "i32 first"];
    // kills needed
    sint32 total = 2 [(flyff.legacy_type) = "i32 second"];
  }

  message GuildList {
    // dropped: n (u32, the list length)
    // the bidding guilds in rank order
    repeated SecretRoomGuild guilds = 1 [(flyff.legacy_type) = "n x {u32, i32, i32, [i32 m, m x u32]}"];
    // dropped: k (u32, the list length)
    // kills needed per war state
    repeated SecretRoomMonsterTotal monster_totals = 2 [(flyff.legacy_type) = "k x {i32, i32}"];
  }

  message KillCount {
    // index in the guild list
    sint32 index = 1 [(flyff.legacy_type) = "i32 nIndex"];
    sint32 kills = 2 [(flyff.legacy_type) = "i32"];
  }

  message WarState {
    // index in the guild list
    sint32 index = 1 [(flyff.legacy_type) = "i32 nIndex"];
    // FAILED 0, NORMAL 1, MIDBOSS 2, BOSS 3, WIN 4
    sint32 war_state = 2 [(flyff.legacy_type) = "i32"];
  }
}
