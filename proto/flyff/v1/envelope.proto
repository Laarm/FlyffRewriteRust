// S->C: one WebSocket binary message per session per flush.
message ServerBatch {
  // appended entry by entry (Plan/11 section 3.4)
  repeated ServerMsg msgs = 1;
  // 60 Hz sim frames completed at the flush: 4*(n+1) after tick n; written last, once
  uint64 server_frame = 2 [(flyff.js_safe_number) = true];
}

