// Envelopes (Plan/11 section 3.1). The session, lobby, world, movement, character, taskbar, combat, skill, pvp,
// inventory, upgrade, shop, trade, bank, mail, pet, npc, quest, chat and notice blocks are filled;
// WP-PROTO-04 generates the remaining entries from Plan/11a. Each file's entries are fenced by BEGIN/END
// comments so parallel WPs never touch the same lines (Plan/11 section 3.1): add a message only inside the
// fence of its own file, with the tag of Plan/11a section 6. A tag is never reused.
