// legacy GUILDCOMBAT 0x00B8 (S2C); obj_id: 0 (NULL_ID) except GcUserState (the mover). The siege multiplexer
// (ref/08 section 13.4, ref/09a section 5.10, Plan/21 section 7). The legacy `u8 sub` selects the payload; the
// field number is sub + 1. Boxed in ServerMsg.
message GuildCombat {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xB8
    name: "GUILDCOMBAT"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  oneof sub {
    // GC_WINGUILD 0
    GcWinGuild gc_win_guild = 1;
    // GC_IN_WINDOW 1
    GcInWindow gc_in_window = 2;
    // GC_IN_COMPLETE 3
    GcInComplete gc_in_complete = 4;
    // GC_REQUEST_STATUS 4
    GcRequestStatus gc_request_status = 5;
    // GC_SELECTPLAYER 5
    GcSelectPlayer gc_select_player = 6;
    // GC_SELECTWARPOS 6
    GcSelectWarPos gc_select_war_pos = 7;
    // GC_BESTPLAYER 7
    GcBestPlayer gc_best_player = 8;
    // GC_ISREQUEST 8
    GcIsRequest gc_is_request = 9;
    // GC_USERSTATE 16
    GcUserState gc_user_state = 17;
    // GC_WARPLAYERLIST 17
    GcWarPlayerList gc_war_player_list = 18;
    // GC_GUILDSTATUS 32
    GcGuildStatus gc_guild_status = 33;
    // GC_GUILDPRECEDENCE 33
    GcGuildPrecedence gc_guild_precedence = 34;
    // GC_PLAYERPRECEDENCE 34
    GcPlayerPrecedence gc_player_precedence = 35;
    // GC_GCSTATE 48
    GcGcState gc_gc_state = 49;
    // GC_NEXTTIMESTATE 49
    GcNextTimeState gc_next_time_state = 50;
    // GC_ENTERTIME 50
    GcEnterTime gc_enter_time = 51;
    // GC_DIAGMESSAGE 51
    GcDiagMessage gc_diag_message = 52;
    // GC_TELE 52
    GcTele gc_tele = 53;
    // GC_LOG 53
    GcLog gc_log = 54;
    // GC_LOG_REALTIME 54
    GcLogRealtime gc_log_realtime = 55;
    // GC_GETPENYAGUILD 64
    GcGetPenyaGuild gc_get_penya_guild = 65;
    // GC_GETPENYAPLAYER 65
    GcGetPenyaPlayer gc_get_penya_player = 66;
    // GC_PLAYERPOINT 66
    GcPlayerPoint gc_player_point = 67;
  }

  // One admitted guild of GC_WARPLAYERLIST.
  message GcWarGuild {
    uint32 defender = 1 [(flyff.legacy_type) = "u32 uidDefender"];
    // dropped: n (i32, the list length)
    repeated GcWarPlayer players = 2 [(flyff.legacy_type) = "n x {u32, i32}"];
  }

  // One selected player of a guild.
  message GcWarPlayer {
    uint32 id_player = 1 [(flyff.legacy_type) = "u32 uidPlayer"];
    // true = fighting (1), false = waiting (0)
    bool fighting = 2 [(flyff.legacy_type) = "i32 status"];
  }

  // A player and his remaining lives.
  message GcLifeEntry {
    uint32 id_player = 1 [(flyff.legacy_type) = "u32 uidPlayer"];
    sint32 lives = 2 [(flyff.legacy_type) = "i32 nLife"];
  }

  // A guild's points, or a hidden entry.
  message GcGuildPoint {
    // false = the guild has no selected player; the next fields are absent
    bool send = 1 [(flyff.legacy_type) = "BOOL bSend"];
    // "Not Guild" for a vanished guild
    string guild_name = 2 [(flyff.legacy_type) = "str<=128 (iff bSend)"];
    sint32 point = 3 [(flyff.legacy_type) = "i32 (iff bSend)"];
  }

  // The player points of one guild.
  message GcPlayerPoints {
    // dropped: n (i32, the list length)
    repeated GcPlayerPointEntry players = 1 [(flyff.legacy_type) = "n x {u32 idPlayer, i32 point}"];
  }

  // A player with points.
  message GcPlayerPointEntry {
    uint32 id_player = 1 [(flyff.legacy_type) = "u32 idPlayer"];
    // used by GC_PLAYERPOINT only; 0 in GC_PLAYERPRECEDENCE
    sint32 job = 2 [(flyff.legacy_type) = "i32 nJob"];
    sint32 point = 3 [(flyff.legacy_type) = "i32 nPoint"];
  }

  // One kill of the siege log.
  message GcLogEntry {
    uint32 guild_attack = 1 [(flyff.legacy_type) = "u32 uidGuildAttack"];
    uint32 guild_defence = 2 [(flyff.legacy_type) = "u32 uidGuildDefence"];
    uint32 player_attack = 3 [(flyff.legacy_type) = "u32 uidPlayerAttack"];
    uint32 player_defence = 4 [(flyff.legacy_type) = "u32 uidPlayerDefence"];
    sint32 point = 5 [(flyff.legacy_type) = "i32 nPoint"];
    bool kill_other_guild = 6 [(flyff.legacy_type) = "BOOL bKillDiffernceGuild"];
    bool master = 7 [(flyff.legacy_type) = "BOOL bMaster"];
    bool defender = 8 [(flyff.legacy_type) = "BOOL bDefender"];
    bool last_life = 9 [(flyff.legacy_type) = "BOOL bLastLife"];
  }

  message GcWinGuild {
    sint32 combat_index = 1 [(flyff.legacy_type) = "i32 combatIndex"];
    // the winning guild of the last siege
    uint32 win_guild = 2 [(flyff.legacy_type) = "u32 winGuildId"];
    // consecutive wins
    sint32 win_count = 3 [(flyff.legacy_type) = "i32 winCount"];
  }

  message GcInWindow {
    // total of the admitted bids
    sint64 prize = 1 [
      (flyff.legacy_type) = "i64 prizePenya",
      (flyff.js_safe_number) = true
    ];
    // the guild's current bid, 0 = none
    uint32 my_bid = 2 [(flyff.legacy_type) = "u32 requestPenya"];
    // the minimum bid
    uint32 min_bid = 3 [(flyff.legacy_type) = "u32 minRequestPenya"];
  }

  // the bid was accepted (Plan/21 section 7.3); defined in MsgHdr.h, its client handler is commented out in
  // V15
  message GcInComplete {}

  message GcRequestStatus {
    // seconds until the next siege opens
    sint32 seconds_to_next = 1 [(flyff.legacy_type) = "i32 tNext"];
    sint64 prize = 2 [
      (flyff.legacy_type) = "i64 prizePenya",
      (flyff.js_safe_number) = true
    ];
    // dropped: n (i32, the list length)
    // applying guilds in rank order; "NotGuild" for a vanished guild
    repeated string guild_names = 3 [(flyff.legacy_type) = "n x str<=128"];
    uint32 my_bid = 4 [(flyff.legacy_type) = "u32 myRequestPenya"];
  }

  message GcSelectPlayer {
    // players that can be selected (10)
    sint32 max_join_member = 1 [(flyff.legacy_type) = "i32 maxJoinMember"];
    // simultaneous fighters (10)
    sint32 max_war_player = 2 [(flyff.legacy_type) = "i32 maxWarPlayer"];
    // true = the guild is admitted; the next fields follow
    bool request_war = 3 [(flyff.legacy_type) = "BOOL bRequestWar"];
    // true = open the editor with the stored line-up; false = the line-up was saved
    bool window = 4 [(flyff.legacy_type) = "BOOL bWindow (iff bRequestWar)"];
    // the stored defender
    uint32 defender = 5 [(flyff.legacy_type) = "u32 uidDefender (iff bWindow)"];
    // dropped: n (i32, the list length)
    // the stored line-up (character ids)
    repeated uint32 ids = 6 [(flyff.legacy_type) = "n x u32 (iff bWindow)"];
  }

  message GcSelectWarPos {
    // the stored entry gate, 99 = random
    sint32 map = 1 [(flyff.legacy_type) = "i32 nMap"];
    // seconds to choose the gate
    sint32 join_time_s = 2 [(flyff.legacy_type) = "i32 nJoinWarTime"];
  }

  message GcBestPlayer {
    // the best player (MVP) of the last siege
    uint32 id_player = 1 [(flyff.legacy_type) = "u32"];
  }

  message GcIsRequest {
    // true = the guild has an active bid
    bool request = 1 [(flyff.legacy_type) = "BOOL bRequest"];
  }

  message GcUserState {
    // the player's object id (also the ServerMsg obj_id)
    uint32 mover_obj_id = 1 [(flyff.legacy_type) = "OBJID idPlayer"];
    // guild combat state: 0 none, 1 fighting, 2 standby
    sint32 state = 2 [(flyff.legacy_type) = "i32 state"];
  }

  message GcWarPlayerList {
    // dropped: nGuild (i32, the list length)
    // one entry per admitted guild in rank order
    repeated GcWarGuild guilds = 1 [(flyff.legacy_type) = "n x {defender, players}"];
  }

  message GcGuildStatus {
    // simultaneous fighters when waiting players remain, else 0; the client marks the entry with this index
    sint32 max_war_player = 1 [(flyff.legacy_type) = "i32"];
    // dropped: n (i32, the list length)
    // the guild's players: fighters first, then the waiting ones, then the eliminated
    repeated GcLifeEntry players = 2 [(flyff.legacy_type) = "n x {u32 idPlayer, i32 nLife}"];
  }

  message GcGuildPrecedence {
    // dropped: n (i32, the list length)
    // one entry per admitted guild
    repeated GcGuildPoint entries = 1 [(flyff.legacy_type) = "n x {BOOL bSend, [str, i32]}"];
  }

  message GcPlayerPrecedence {
    // dropped: nGuilds (i32, the list length)
    // one entry per admitted guild
    repeated GcPlayerPoints guilds = 1 [(flyff.legacy_type) = "n x {i32 n, n x {u32, i32}}"];
  }

  message GcGcState {
    // siege state (see the file header)
    sint32 state = 1 [(flyff.legacy_type) = "i32 nState"];
    // war state (see the file header)
    sint32 war_state = 2 [(flyff.legacy_type) = "OBJID nWarState"];
  }

  message GcNextTimeState {
    // milliseconds until the next state
    uint32 time_ms = 1 [(flyff.legacy_type) = "DWORD dwTime"];
    // the war state that follows
    uint32 state = 2 [(flyff.legacy_type) = "DWORD dwState"];
  }

  message GcEnterTime {
    // milliseconds left to enter the siege map
    uint32 time_ms = 1 [(flyff.legacy_type) = "DWORD dwTime"];
  }

  message GcDiagMessage {
    // text of an information box
    string text = 1 [(flyff.legacy_type) = "str<=511"];
  }

  message GcTele {
    // text of an information box with a leave button
    string text = 1 [(flyff.legacy_type) = "str<=511"];
  }

  message GcLog {
    // dropped: n (u32, the list length)
    // the kill log of the siege
    repeated GcLogEntry entries = 1 [(flyff.legacy_type) = "n x GCGETPOINT"];
  }

  message GcLogRealtime {
    uint32 guild_attack = 1 [(flyff.legacy_type) = "u32 guildAtk"];
    uint32 guild_defence = 2 [(flyff.legacy_type) = "u32 guildDef"];
    string attacker_name = 3 [(flyff.legacy_type) = "str<=64"];
    string defender_name = 4 [(flyff.legacy_type) = "str<=64"];
    uint32 player_attack = 5 [(flyff.legacy_type) = "u32 playerAtk"];
    uint32 player_defence = 6 [(flyff.legacy_type) = "u32 playerDef"];
    // points the kill earned
    sint32 point = 7 [(flyff.legacy_type) = "i32 nPoint"];
    // bonus reason: killed a different guild (never set, KQ-20)
    bool kill_other_guild = 8 [(flyff.legacy_type) = "BOOL bKillDiffernceGuild"];
    // bonus reason: the attacker is a guild master
    bool master = 9 [(flyff.legacy_type) = "BOOL bMaster"];
    // bonus reason: the victim is the defender
    bool defender = 10 [(flyff.legacy_type) = "BOOL bDefender"];
    // bonus reason: the attacker is on his last life
    bool last_life = 11 [(flyff.legacy_type) = "BOOL bLastLife"];
  }

  message GcGetPenyaGuild {
    // 0 prize, 1 refund, 2 nothing to claim, 3 overflow
    sint32 result = 1 [(flyff.legacy_type) = "i32"];
    sint64 penya = 2 [
      (flyff.legacy_type) = "i64",
      (flyff.js_safe_number) = true
    ];
  }

  message GcGetPenyaPlayer {
    // 0 prize, 1 not the best player, 2 overflow
    sint32 result = 1 [(flyff.legacy_type) = "i32"];
    sint64 penya = 2 [
      (flyff.legacy_type) = "i64",
      (flyff.js_safe_number) = true
    ];
  }

  message GcPlayerPoint {
    // dropped: n (u32, the list length)
    // the cross-siege ranking
    repeated GcPlayerPointEntry entries = 1 [(flyff.legacy_type) = "n x {u32, i32, i32}"];
  }
}

