// legacy SELECTPLAYER_GUILDCOMBAT 0xF000D027 (C2S): open the line-up editor (window = true) or submit the
// line-up (ref/07b section 17, ref/09a section 7, Plan/21 section 7.4). The master or a kingpin, while the
// line-up is open; every id must be a guild member (FIX VR-049). Answer: GuildCombat (GC_SELECTPLAYER,
// GC_GUILDSTATUS, GC_WARPLAYERLIST).
message SelectPlayerGuildCombat {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xF000D027
    name: "SELECTPLAYER_GUILDCOMBAT"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // true = only open the editor (defender and ids are absent); false = submit the line-up
  bool window = 1 [(flyff.legacy_type) = "BOOL bWindow"];
  // the defender (character id); must be in the list
  uint32 defender = 2 [(flyff.legacy_type) = "u32 uidDefender (iff !bWindow)"];
  // the selected players (character ids), at most the configured maximum (10); the count is the list length
  repeated uint32 ids = 3 [
    (flyff.legacy_type) = "i32 n + n x u32 (iff !bWindow)",
    (flyff.max_len) = 80
  ];
}

