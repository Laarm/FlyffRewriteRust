// Guild siege ("guild combat") and guild combat 1:1 messages (Plan/11 section 4.2, WP-PROTO-23; tag block 752-783).
// Transcribed from ref/08 section 13.4, ref/07b section 17, ref/07c section 13, ref/09a sections 5.10 and 7,
// _Network/MsgHdr.h (GC_* sub-types) and Plan/21 sections 7 and 8. The S2C `GuildCombat` is the multiplexed
// SNAPSHOTTYPE_GUILDCOMBAT: one message with an inner oneof, field number = legacy sub-type + 1 (Plan/11 section
// 5.2), one nested message per sub-type named after the constant (GC_WINGUILD -> GcWinGuild). Siege states
// (GcGcState.state): OPEN 0, CLOSE 1, WAR 2, COMPLET_CLOSE 3, GM_CLOSE 4; war states (war_state): NOTENTER 100,
// NOTENTER_COUNT 101, ENTER 102, MAINTENANCE 103, WAR_WAR 104, WAR_CLOSE 105, WAR_CLOSE_WAIT 106, WAR_TELEPORT 107.
// GC1:1 manager states: CLOSE 0, OPEN 1, ENTRANCE 2, WAR 3; arena states CLOSE 100, WAIT 101, WAR 102, FINISH 103,
// CLOSE_WAIT 104. Every C2S message acts for the session character (VR-001).
syntax = "proto3";

package flyff.v1;

import "flyff/options.proto";

// legacy IN_GUILDCOMBAT 0xF000D022 (C2S): the guild master opens the siege application window or bids (ref/07b
// section 17, ref/09a section 7, Plan/21 section 7.3). The legacy `u8 nState` selects the payload; the field
// number is nState + 1. The master only. Answers: GuildCombat (GC_IN_WINDOW), GuildCombat (GC_IN_COMPLETE) and
// GC_ISREQUEST.
message InGuildCombat {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xF000D022
    name: "IN_GUILDCOMBAT"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  oneof sub {
    // GC_IN_WINDOW 1
    GcInWindow gc_in_window = 2;
    // GC_IN_APP 2
    GcInApp gc_in_app = 3;
  }

  message GcInWindow {}

  message GcInApp {
    // the bid in penya: at least the minimum, higher than the previous bid, at most 2147483647
    uint32 penya = 1 [(flyff.legacy_type) = "u32 dwPenya"];
  }
}

// legacy OUT_GUILDCOMBAT 0xF000D023 (C2S): the master withdraws the siege application while applications are
// open (ref/07b section 17, Plan/21 section 7.3). No payload. Answer: GC_ISREQUEST, and the refund by mail.
message OutGuildCombat {
  option (flyff.legacy_id) = {
