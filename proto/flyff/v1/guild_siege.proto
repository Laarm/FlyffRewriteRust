// legacy GC1TO1_WARRESULT 0x0129 (S2C); obj_id: 0 (NULL_ID). The result of a 1:1 round (ref/08 section 13.4,
// Plan/21 section 8.5) in the view of the RECIPIENT (User.cpp:3564-3571, GuildCombat1to1.cpp:186-199): the fields
// describe the recipient's own guild first, the opposing guild second.
message Gc1to1WarResult {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x129
    name: "GC1TO1_WARRESULT"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M7";
  // the recipient guild's last round result: READY 200, WAR 201 (the round begins), WIN 202, LOSE 203, DRAW 204
  sint32 state = 1 [(flyff.legacy_type) = "i32 m_nState"];
  // the recipient guild's k-th fighter of the round; 0 beyond its line-up (the original sent NULL_ID)
