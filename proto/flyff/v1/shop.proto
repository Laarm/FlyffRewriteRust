// Shop messages (Plan/11 section 4.2, WP-PROTO-16; tag block 352-383): the NPC shops (penya and chip vendors,
// quick sell) and the beauty shop. Transcribed from ref/07a sections 8.3-8.7, ref/07b section 6, ref/07c
// section 30.2, ref/08 sections 12.2 and 14, ref/13 section 12 and Plan/19 section 7.
//
// The shop session: OpenShopWndReq links the player to the vendor NPC (the legacy `m_vtInfo.GetOther()` slot,
// shared with trade and vendor browsing), BuyItem / BuyChipItem / SellItem / QuickSell work on that link. Stock
// is infinite; `Vendor` and `UpdateVendor` are defined but never emitted (the legacy emitted them only from the
// unused RemoveVendorItem).
syntax = "proto3";

package flyff.v1;

import "flyff/options.proto";
import "flyff/v1/item_types.proto";

// legacy SET_HAIR 0x00FF00AF (C2S): the beauty-shop hair change (ref/07b section 6.2, Plan/19 section 7.8).
// Cost: HAIR_COST 2000000 when the mesh changes plus HAIRCOLOR_COST 4000000 when the colour changes, or one
// II_SYS_SYS_SCR_HAIRCHANGE coupon. VR-026: the coupon is checked BEFORE anything changes and `hair >= 10` is
// refused. Answer: SetHairNtf to near.
message SetHairReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF00AF
    name: "SET_HAIR"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the hair mesh 0..9
  uint32 hair = 1 [(flyff.legacy_type) = "u8 nHair"];
  // red 0..255
  uint32 r = 2 [(flyff.legacy_type) = "u8 nR"];
  // green 0..255
  uint32 g = 3 [(flyff.legacy_type) = "u8 nG"];
  // blue 0..255
  uint32 b = 4 [(flyff.legacy_type) = "u8 nB"];
  // pay with the coupon item instead of penya
  bool use_coupon = 5 [(flyff.legacy_type) = "BOOL bUseCoupon"];
}

// legacy CHANGEFACE 0x00FF00EE (C2S): the beauty-shop face change (ref/07b section 6.1, Plan/19 section 7.8).
// Costs CHANGE_FACE_COST 1000000 penya or one II_SYS_SYS_SCR_FACEOFFFREE coupon. VR-026: `face >= 11` is
// refused and the coupon is checked first. Answer: ChangeFaceNtf to near including self.
message ChangeFaceReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF00EE
    name: "CHANGEFACE"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // dropped: objId (the legacy client sent its own player id, unvalidated; the session character is used,
  // VR-001)
  // the new head mesh 0..10
  uint32 face = 1 [(flyff.legacy_type) = "u32 dwFaceNum"];
  // ignored: the server charges CHANGE_FACE_COST
  sint32 cost = 2 [(flyff.legacy_type) = "i32 cost"];
  // pay with the coupon item instead of penya
  bool use_coupon = 3 [(flyff.legacy_type) = "BOOL bUseCoupon"];
}

// legacy OPENSHOPWND 0x00FF00B1 (C2S): open the shop of a vendor NPC (ref/07a section 8.3, Plan/19 section
// 7.2). FIX (VR-012): the NPC must be a vendor in the player's world within gameplay.npc_menu_range (the
// legacy had no distance check); the player must have no other partner and no open bank. Answer:
// OpenShopWndNtf.
message OpenShopWndReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF00B1
    name: "OPENSHOPWND"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the vendor NPC
  uint32 npc_obj_id = 1 [(flyff.legacy_type) = "u32 objid"];
}

// legacy CLOSESHOPWND 0x00FF00B2 (C2S): close the shop window; clears the shop link (ref/07a section 8.4). No
// payload, no answer.
message CloseShopWnd {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF00B2
    name: "CLOSESHOPWND"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
}

// legacy BUYITEM 0x00FF00B3 (C2S): buy from a penya shop (ref/07a section 8.5, Plan/19 section 7.3). The
// price is GetCost x shop factors + tax, minimum 1, Perin fixed at 100000000; the count is clamped to the
// stock and to what the gold pays. Answer: CreateItem + SetPointParam(DST_GOLD), or DefinedText
// TID_GAME_LACKMONEY / TID_GAME_LACKSPACE.
message BuyItem {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF00B3
    name: "BUYITEM"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the shop tab 0..3
  sint32 tab = 1 [(flyff.legacy_type) = "i8 cTab"];
  // the object id of the item inside the tab container
  uint32 obj_id = 2 [(flyff.legacy_type) = "u8 nId"];
  // the count, >= 1
  sint32 num = 3 [(flyff.legacy_type) = "i16 nNum"];
  // the ItemProp id of the shop entry (sanity check against the entry)
  uint32 item_id = 4 [(flyff.legacy_type) = "u32 dwItemId"];
}

// legacy BUYCHIPITEM 0x00FF00B6 (C2S): buy from a red-chip shop (the guild-siege currency; ref/07a section
// 8.6, Plan/19 section 7.3). Same layout as BuyItem; the price is the item's refer value 1 in II_CHP_RED.
// VR-020: the chips are removed only when the item fits.
message BuyChipItem {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF00B6
    name: "BUYCHIPITEM"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the shop tab 0..3
  sint32 tab = 1 [(flyff.legacy_type) = "i8 cTab"];
  // the object id of the item inside the tab container
  uint32 obj_id = 2 [(flyff.legacy_type) = "u8 nId"];
  // the count, >= 1
  sint32 num = 3 [(flyff.legacy_type) = "i16 nNum"];
  // the ItemProp id of the shop entry
  uint32 item_id = 4 [(flyff.legacy_type) = "u32 dwItemId"];
}

// legacy SELLITEM 0x00FF00B4 (C2S): sell to a shop NPC (ref/07a section 8.7, Plan/19 section 7.4). Pays
// GetCost / 4 (minimum 1, minus sales tax) per unit; refused for equipped, quest, event-main, Perin,
// sealed-character, in-use and vagrant-ride items and when the gold would reach 2100000000.
message SellItem {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF00B4
    name: "SELLITEM"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the inventory object id
  uint32 obj_id = 1 [(flyff.legacy_type) = "u8 nId"];
  // the count, >= 1 (clamped to the stack)
  sint32 num = 2 [(flyff.legacy_type) = "i16 nNum"];
}

// legacy QUICKSELL 0xAA000003 (C2S; repack __QUICK_SELL): sell every non-equipped, non-upgraded weapon,
// armour, jewel and pet egg of the bag to the open shop (ref/07c section 30.2, Plan/19 section 7.7). FIX
// (VR-021): needs an open shop session (the legacy dereferenced a null partner). No payload.
message QuickSell {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xAA000003
    name: "QUICKSELL"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
}

// legacy SET_HAIR 0x0048 (S2C); obj_id: the player. The new hair of a player; audience near including self
// (ref/08 section 14, Plan/19 section 7.8).
message SetHairNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x48
    name: "SET_HAIR"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the hair mesh
  uint32 hair = 1 [(flyff.legacy_type) = "u8 nHair"];
  // red 0..255
  uint32 r = 2 [(flyff.legacy_type) = "u8 r"];
  // green 0..255
  uint32 g = 3 [(flyff.legacy_type) = "u8 g"];
  // blue 0..255
  uint32 b = 4 [(flyff.legacy_type) = "u8 b"];
}

// legacy CHANGEFACE 0x004D (S2C); obj_id: the player's mover. The new head mesh of a player. FIX (11a,
// PL-154): audience near including self instead of the legacy broadcast to every user, so the header can name
// the mover (the legacy header was NULL_ID); the character id of the legacy payload is kept (ref/08 section
// 14, Plan/19 section 7.8).
message ChangeFaceNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x4D
    name: "CHANGEFACE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the character (player id)
  uint32 id_player = 1 [(flyff.legacy_type) = "u32 uidPlayer"];
  // the head mesh
  uint32 face = 2 [(flyff.legacy_type) = "u32 dwFace"];
}

// legacy SEX_CHANGE 0x00DC (S2C); obj_id: the player. The player's mover index changed with the sex; audience
// near including self (ref/08 section 14).
message SexChange {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xDC
    name: "SEX_CHANGE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // MI_MALE / MI_FEMALE
  uint32 mover_index = 1 [(flyff.legacy_type) = "u16 moverIndex"];
}

// legacy OPENSHOPWND 0x0014 (S2C); obj_id: the vendor NPC. The four tab containers of a shop, sent to the
// player that opened it (ref/08 section 12.2, ref/09a, Plan/19 section 7.2). Boxed in ServerMsg (four
// containers).
message OpenShopWndNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x14
    name: "OPENSHOPWND"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // exactly 4 tabs of 100 slots (MAX_VENDOR_INVENTORY)
  repeated ItemContainer tabs = 1 [(flyff.legacy_type) = "MAX_VENDOR_INVENTORY_TAB x CItemContainer::Serialize"];
}

// legacy VENDOR 0x0015 (S2C); obj_id: the vendor NPC. A restock of a shop, sent to the players that have it
// open (ref/08 section 12.2). Defined but never emitted: the stock is infinite (Plan/19 section 7.1). Boxed
// in ServerMsg.
message Vendor {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x15
    name: "VENDOR"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // exactly 4 tabs of 100 slots
  repeated ItemContainer tabs = 1 [(flyff.legacy_type) = "MAX_VENDOR_INVENTORY_TAB x CItemContainer::Serialize"];
}

// legacy UPDATE_VENDOR 0x0016 (S2C); obj_id: the vendor NPC. One stock entry changed (num 0 removes it); sent
// to the players that have the shop open (ref/09a). Defined but never emitted (Plan/19 section 7.1).
message UpdateVendor {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x16
    name: "UPDATE_VENDOR"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the shop tab 0..3
  sint32 tab = 1 [(flyff.legacy_type) = "i8 cTab"];
  // the object id of the entry inside the tab container
  uint32 obj_id = 2 [(flyff.legacy_type) = "u8 nId"];
  // the new stock count, 0 = removed
  sint32 num = 3 [(flyff.legacy_type) = "i16 nNum"];
}
