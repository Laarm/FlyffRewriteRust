message GameRate {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x2E
    name: "GAMERATE"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF06
    name: "GAMERATE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M4";
  // the rate
  float rate = 1 [(flyff.legacy_type) = "f32"];
  // SHOPCOST 0, ITEMDROP 1, GOLDDROP 2, MONSTEREXP 3, MONSTERHIT 4, X3 5, REBIRTH 6, HITPOINT 7, AGGRESSIVE 8,
  // RESPAWN 9, SKILL_VAGSP 0x10, EXPERTSP 0x11, PROSP 0x12, SHOP_BUY 0x13, SHOP_SELL 0x14
  uint32 kind = 2 [(flyff.legacy_type) = "u8"];
}

// legacy CALLTHEROLL 0x003D (S2C); obj_id: 0 (self). The attendance event flags of the receiver (ref/08
