  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
  // the coupon count (the V15 client ignores it)
  sint32 coupons = 1 [(flyff.legacy_type) = "i32"];
}

// legacy MINIGAME 0x00E8 (S2C); obj_id: 0 (self). The mini-game multiplexer (ref/08 section 15.3, ref/09b
// section 3.15, Plan/22). The legacy `u8 sub` selects the payload; the field number is sub + 1:
// KAWIBAWIBO_RESUTLT 1, REASSEMBLE_RESULT 2, REASSEMBLE_OPENWND 3, ALPHABET_OPENWND 4, ALPHABET_RESULT 5,
// FIVESYSTEM_OPENWND 6, FIVESYSTEM_RESULT 7.
message MiniGame {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xE8
    name: "MINIGAME"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
  oneof sub {
    // MINIGAME_KAWIBAWIBO_RESUTLT 1
    KawibawiboResult kawibawibo_result = 2;
    // MINIGAME_REASSEMBLE_RESULT 2
    ReassembleResult reassemble_result = 3;
    // MINIGAME_REASSEMBLE_OPENWND 3
    ReassembleOpenWnd reassemble_open_wnd = 4;
    // MINIGAME_ALPHABET_OPENWND 4
    AlphabetOpenWnd alphabet_open_wnd = 5;
    // MINIGAME_ALPHABET_RESULT 5
    AlphabetResult alphabet_result = 6;
    // MINIGAME_FIVESYSTEM_OPENWND 6
    FiveSystemOpenWnd five_system_open_wnd = 7;
    // MINIGAME_FIVESYSTEM_RESULT 7
    FiveSystemResult five_system_result = 8;
  }

  message KawibawiboResult {
    // WIN 0, LOST 1, DRAW 2, FAILED 3, GETITEM 4
    sint32 result = 1 [(flyff.legacy_type) = "i32"];
    sint32 win_count = 2 [(flyff.legacy_type) = "i32"];
    // the prize item now (WIN: of the current streak; GETITEM: the item received)
    uint32 item_id = 3 [(flyff.legacy_type) = "u32 (iff WIN or GETITEM)"];
    // the prize item of the next streak
    uint32 next_item_id = 4 [(flyff.legacy_type) = "u32 (iff WIN)"];
    sint32 item_count = 5 [(flyff.legacy_type) = "i32 (iff WIN or GETITEM)"];
    sint32 next_item_count = 6 [(flyff.legacy_type) = "i32 (iff WIN)"];
    // the longest streak
    sint32 max_win_count = 7 [(flyff.legacy_type) = "i32 (iff WIN)"];
  }

  message ReassembleResult {
    uint32 item_id = 1 [(flyff.legacy_type) = "u32"];
    sint32 count = 2 [(flyff.legacy_type) = "i32"];
  }

  message ReassembleOpenWnd {
    // dropped: n (u32, the list length)
    // the nine card item ids
    repeated uint32 card_item_ids = 1 [(flyff.legacy_type) = "n x u32"];
  }

  message AlphabetOpenWnd {
    sint32 question_id = 1 [(flyff.legacy_type) = "i32"];
    // 0-based position of the revealed letter
    sint32 public_pos = 2 [(flyff.legacy_type) = "i32"];
    // the revealed letter
    sint32 public_char = 3 [(flyff.legacy_type) = "i8"];
    string question = 4 [(flyff.legacy_type) = "str<=255"];
  }

  message AlphabetResult {
    // the question id on success, 998 or 999
    sint32 result = 1 [(flyff.legacy_type) = "i32"];
    uint32 item_id = 2 [(flyff.legacy_type) = "u32 (iff result != 999)"];
    sint32 count = 3 [(flyff.legacy_type) = "i32 (iff result != 999)"];
  }

  message FiveSystemOpenWnd {
    sint32 min_bet = 1 [(flyff.legacy_type) = "i32"];
    sint32 max_bet = 2 [(flyff.legacy_type) = "i32"];
    sint32 multiple = 3 [(flyff.legacy_type) = "i32"];
  }

  message FiveSystemResult {
    // BETOK 996, FAILED 997, OVERMAX 998, NOTENOUGH 999, or the rolled face 0..5
    sint32 result = 1 [(flyff.legacy_type) = "i32"];
    // BETOK: the stake now on the face; a rolled face: the prize paid
    sint32 penya = 2 [(flyff.legacy_type) = "i32 (iff not FAILED / OVERMAX / NOTENOUGH)"];
    // the face the stake is on
    sint32 bet_num = 3 [(flyff.legacy_type) = "i32 (iff BETOK)"];
  }
}

// legacy QUIZ_STATE 0x9920 (S2C); obj_id: 0 (self). The quiz type and state (ref/08 section 15.3, ref/09b
