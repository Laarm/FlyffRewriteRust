// legacy RAINBOWRACE_MINIGAME_PACKET 0x70002003 (C2S): a move in the racer's current mini-game (ref/07c
// section 23, Plan/22). The legacy `BOOL bExt` selects the plain or the extended packet.
message RainbowRaceMiniGamePacket {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x70002003
    name: "RAINBOWRACE_MINIGAME_PACKET"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
  // true = the packet carries the texts
  bool ext = 1 [(flyff.legacy_type) = "BOOL bExt"];
  // the base packet
  MiniGamePacket packet = 2 [(flyff.legacy_type) = "__MINIGAME_PACKET"];
  // dropped: n (u32, the list length; iff bExt)
  // the texts, for example the typed words
  repeated string data = 3 [
    (flyff.legacy_type) = "n x str<=255 (iff bExt)",
    (flyff.max_len) = 32
  ];
}

