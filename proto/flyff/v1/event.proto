  uint32 state = 2 [(flyff.legacy_type) = "u8 state"];
}

// legacy GAMERATE: SNAPSHOTTYPE 0x002E and PACKETTYPE 0x0000FF06 (S2C, merged); obj_id: 0 (self). A game rate
