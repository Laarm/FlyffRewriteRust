// legacy EVENTLUA_DESC 0x0121 (S2C); obj_id: 0 (self). The description of the running Event.lua events, at
// login and when an event starts or stops (ref/08 section 14, Plan/22). Not sent when empty.
message EventLuaDesc {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x121
    name: "EVENTLUA_DESC"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M4";
  // 0 stopped, 1 started, 2 login or periodic refresh
  sint32 state = 1 [(flyff.legacy_type) = "i32 state"];
  // the text of the running events
  string description = 2 [(flyff.legacy_type) = "str"];
}

// legacy FLYFF_EVENT 0x00B2 (S2C); obj_id: 0 (self). The event state flags, in the join batch (ref/08 sections
// 6.1 and 14, Plan/22).
message FlyffEvent {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xB2
    name: "FLYFF_EVENT"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M2";
  // exactly 1024 bytes in the legacy CFlyffEvent layout
  bytes flags = 1 [(flyff.legacy_type) = "raw(u8[1024])"];
}

// legacy SET_LOCAL_EVENT 0x00B3 (S2C); obj_id: 0 (self). One event flag changed; broadcast to everyone (ref/08
