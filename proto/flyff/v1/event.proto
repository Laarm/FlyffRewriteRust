  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
  // one bit per day
  sint64 attendance_bits = 1 [(flyff.legacy_type) = "i64 attendanceBits"];
}

// legacy EVENT_COUPON 0x0146 (S2C); obj_id: 0 (self). The coupon event notice (ref/08 section 15.3, ref/09b
// section 3.16, Plan/22).
message EventCoupon {
