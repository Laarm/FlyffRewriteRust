// legacy QUIZ_QUESTION 0x9922 (S2C); obj_id: 0 (self). The question of the round (ref/08 section 15.3, ref/09b
// section 3.16, Plan/22).
message QuizQuestion {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x9922
    name: "QUIZ_QUESTION"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
  // 1 = OX, 2 = four choices
  sint32 type = 1 [(flyff.legacy_type) = "i32"];
