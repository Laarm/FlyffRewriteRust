// Event messages (Plan/11 section 4.2, WP-PROTO-25; tag block 848-879): Event.lua descriptions, event flags, game rates,
// attendance and coupon, the mini-games, the quiz event and the rainbow race. Transcribed from ref/08 sections 14 and
// 15.3, ref/07c sections 7, 23 and 27, ref/09b sections 3.15, 3.16 and 7.10 and Plan/22. The helper types are
// RainbowRace (CRainbowRace), MiniGamePacket and MiniGameExtPacket (__MINIGAME_PACKET, __MINIGAME_EXT_PACKET).
// Mini-game result codes: KAWIBAWIBO WIN 0, LOST 1, DRAW 2, FAILED 3, GETITEM 4; ALPHABET NOTENOUGH_MONEY 998,
// FAILED 999; FIVESYSTEM BETOK 996, FAILED 997, OVERMAX 998, NOTENOUGH 999, a rolled face 0..5 otherwise. Rainbow
// race mini-game states: NONE 0, OPENWND 1, TRUE 2, FALSE 3, FINISH 4, FAIL 5; game bits: GAWIBAWIBO 1, DICEPLAY 2,
// ARITHMATIC 4, STOPWATCH 8, TYPING 16, PAIRGAME 32, LADDER 64. Quiz states: CLOSE 0, OPEN 1, CLOSE_WAIT 2,
// WATCHINGZONE_OPEN 3, QUESTION 4, CORRECT_ANSWER 5, DROP_OUT 6, WINNER 7. Every C2S message acts for the session
// character (VR-001).
syntax = "proto3";

package flyff.v1;

import "flyff/options.proto";

// __MINIGAME_PACKET (ref/07c section 23, ref/09b section 7.10): the base packet of a rainbow race mini-game.
message MiniGamePacket {
  // bit of the mini-game this packet belongs to
  uint32 now_game = 1 [(flyff.legacy_type) = "u16 wNowGame"];
  // NONE 0, OPENWND 1, TRUE 2, FALSE 3, FINISH 4, FAIL 5
  sint32 state = 2 [(flyff.legacy_type) = "i32 nState"];
  sint32 param1 = 3 [(flyff.legacy_type) = "i32 nParam1"];
  sint32 param2 = 4 [(flyff.legacy_type) = "i32 nParam2"];
}

// __MINIGAME_EXT_PACKET (ref/07c section 23, ref/09b section 7.10): the base packet plus a list of texts
// (questions, typing words).
message MiniGameExtPacket {
  // the base packet
  MiniGamePacket packet = 1 [(flyff.legacy_type) = "__MINIGAME_PACKET"];
  // dropped: n (u32, the list length)
  // the texts
  repeated string data = 2 [(flyff.legacy_type) = "n x str<=255"];
}

// CRainbowRace::Serialize (ref/09b section 7.10): the running state of the rainbow race for one racer.
message RainbowRace {
  // bit of the current mini-game
  uint32 now_game = 1 [(flyff.legacy_type) = "u16 nowGameBit"];
  // bits of the finished mini-games
  uint32 completed_mask = 2 [(flyff.legacy_type) = "u16 completedMask"];
  // milliseconds left, 0 = no timer
  uint32 remain_ms = 3 [(flyff.legacy_type) = "u32 remainMs"];
}

// legacy KAWIBAWIBO_START 0xF000F100 (C2S): play a round of rock-paper-scissors (ref/07c section 7, Plan/22).
// Needs the coupon item unless the last round was a draw or a win. No payload. Answer: MiniGame
// (kawibawibo_result).
message KawibawiboStart {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xF000F100
    name: "KAWIBAWIBO_START"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "22";
  option (flyff.milestone) = "M7";
}

