  sint32 obj_id = 2 [(flyff.legacy_type) = "i32"];
  sint32 num = 3 [(flyff.legacy_type) = "i16"];
}

// legacy START_COLLECTING 0x0123 (S2C); obj_id: the collector. Audience: near including self. No payload.
message StartCollecting {
