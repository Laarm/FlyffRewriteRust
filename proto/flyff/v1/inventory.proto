// legacy SEALCHAR_REQ 0x0144 (S2C); obj_id: 0 (self). The other characters of the account to choose the
// sealing destination from (ref/09b section 3.12). Deferred feature (PL-144, PD-20): never emitted. The
// legacy i16 count is the list length.
message SealCharNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x144
    name: "SEALCHAR_REQ"
  };
