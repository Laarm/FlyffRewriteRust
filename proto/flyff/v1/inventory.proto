  repeated SealCharEntry entries = 1 [(flyff.legacy_type) = "i16 n + n x {i32, u32, str}"];
}

// legacy SEALCHARGET_REQ 0x0145 (S2C); obj_id: 0 (self). The character was sealed: the client shows
// TID_DIAG_0023 and returns to the login screen. Deferred feature (PL-144, PD-20): never emitted. No
// payload.
message SealCharGetNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x145
    name: "SEALCHARGET_REQ"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M8";
}

// One equipped part of QueryEquipNtf.
message QueryEquipEntry {
  // equip part 0..30
  sint32 part = 1 [(flyff.legacy_type) = "i32"];
  // the packed random-option word; bit-packed like ItemElem.random_opt_item_id, no js_safe_number
  sint64 random_opt_item_id = 2 [(flyff.legacy_type) = "i64"];
  Piercing piercing = 3 [(flyff.legacy_type) = "SerializePiercing"];
  // element
  uint32 item_resist = 4 [(flyff.legacy_type) = "u8 m_bItemResist"];
  sint32 resist_ability_option = 5 [(flyff.legacy_type) = "i32 m_nResistAbilityOption"];
}

// One character of the account in SealCharNtf.
message SealCharEntry {
  // character slot
  sint32 slot = 1 [(flyff.legacy_type) = "i32 nPlayerSlot"];
  uint32 id_player = 2 [(flyff.legacy_type) = "u32 idPlayer"];
  string name = 3 [(flyff.legacy_type) = "str<=42"];
}
