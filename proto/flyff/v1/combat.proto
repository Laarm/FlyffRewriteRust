// legacy DAMAGE 0x0013 (S2C); obj_id: the defender. Every resolved hit with the victim surviving, every miss
// (damage 0, AF_MISS), counter-attack hits and trap damage; never the killing blow (Plan/11 G6, Plan/17
// section 5.17). Audience: near of the defender, including the defender. The client sets HP to `hp_after`
// (no client-side subtraction, PL-083) and shows the feedback of ref/09a section 6.5 (numbers, miss,
// critical, block, parry, resist from atk_flags).
//
// The legacy tail of AF_FLYING (defender_pos, defender_angle) is kept as fields 4 and 5: they are set only
// when `atk_flags & AF_FLYING`. The client then snaps the defender to them and applies the same knock-back
// as the server (DoDamageFly(attacker_angle, 145, 0.18)) starting at `server_frame`.
message Damage {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x13
    name: "DAMAGE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "17";
  option (flyff.milestone) = "M3";
  // attacking object id
  uint32 attacker = 1 [(flyff.legacy_type) = "u32 objidAttacker"];
  // damage dealt (0 for a miss)
  uint32 damage = 2 [(flyff.legacy_type) = "u32 dwHit"];
  // AF_* bit set (see the file header)
  uint32 atk_flags = 3 [(flyff.legacy_type) = "u32 dwAtkFlags"];
  // defender position at the hit
  Vec3 defender_pos = 4 [(flyff.legacy_type) = "vec3 (iff AF_FLYING)"];
  // defender yaw at the hit, degrees
  float defender_angle = 5 [(flyff.legacy_type) = "f32 (iff AF_FLYING)"];
  // added (PL-083): the defender HP after the hit (for a miss: the current HP)
  sint32 hp_after = 100;
  // added: the first frame of the damage motion on the defender (the attacker hit frame + 1),
  // movement::effect_frame (Plan/11 section 9.4)
  uint64 server_frame = 101 [(flyff.js_safe_number) = true];
  // added (Plan/31 Q10): the attacker yaw in degrees at the hit frame, exactly the angle the server passes
  // to its knock-back
  float attacker_angle = 102;
}

// legacy MELEE_ATTACK 0x00E0 and MELEE_ATTACK2 0x00E4 (S2C), merged (Plan/11a R1-2); obj_id: the attacker.
// Relay of a melee swing (a player request, or a monster melee: param3 = MAKELONG(0, nError), the hit/miss
// pre-roll). Audience: near minus self (the attacker predicted the swing locally).
message MeleeAttackNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xE0
    name: "MELEE_ATTACK"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xE4
    name: "MELEE_ATTACK2"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "17";
  option (flyff.milestone) = "M3";
  uint32 atk_msg = 1 [(flyff.legacy_type) = "u32 dwAtkMsg"];
  // target mover object id
  uint32 target = 2 [(flyff.legacy_type) = "u32 objid"];
  sint32 param2 = 3 [(flyff.legacy_type) = "i32 nParam2"];
  sint32 param3 = 4 [(flyff.legacy_type) = "i32 nParam3"];
  // added (Plan/11 section 9.4): the sim frame at which the server started the action, so observers start
  // the swing in phase
  uint64 server_frame = 100 [(flyff.js_safe_number) = true];
  // added (Plan/11 section 8.6): the attacker animation speed (m_fAniSpeed) when the action started on the
  // server
  float ani_speed = 101;
}

// ext 0xFE000020; legacy CREATESFXALLOW 0x00AA (merged); obj_id: the attacker. A server-simulated projectile
// starts at the attacker hit frame (Plan/11 section 8.3, Plan/17 section 4). Audience: near including self
// (the shooter's own projectile is server-driven too). The client runs the same flight with the shared sim
// from `server_frame`; `ProjectileHit` ends it.
message ProjectileSpawn {
  option (flyff.ext_id) = 0xFE000020;
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xAA
    name: "CREATESFXALLOW"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "17";
  option (flyff.milestone) = "M3";
  // per process, never reused; equals the *AttackNtf.projectile_id
  uint32 projectile_id = 1;
  ProjectileKind kind = 2;
  // XI_* flying effect
  uint32 sfx_id = 3;
  // XI_* spawned on impact (0 = none)
  uint32 hit_sfx_id = 4;
  // homing target (0 for ATK_STRAIGHT)
  uint32 target_obj_id = 5;
  // attacker hit-frame origin
  Vec3 origin = 6;
  // initial destination (target + 1 y, or a fixed point)
  Vec3 dest = 7;
  // the frame at which the projectile is at `origin`
  uint64 server_frame = 8 [(flyff.js_safe_number) = true];
  // units per 60 Hz frame (e.g. 0.4, 0.7, 0.45 with __FASTER_PROJECTILES)
  float speed = 9;
  // 0 = normal attack
  uint32 skill_id = 10;
  // always 0: the impact sound comes from the client IMPACT_SOUND table
  uint32 hit_sound_id = 11;
  // multi-shot index (one shot every 4th frame)
  uint32 shot_index = 12;
}

// legacy MAGIC_ATTACK 0x00E1 (S2C); obj_id: the attacker. Relay of a wand attack (ref/08 section 10.1).
// Audience: near minus self. The projectile itself is announced by ProjectileSpawn at the hit frame.
message MagicAttackNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xE1
    name: "MAGIC_ATTACK"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "17";
  option (flyff.milestone) = "M3";
  uint32 atk_msg = 1 [(flyff.legacy_type) = "u32 dwAtkMsg"];
  // target mover object id
  uint32 target = 2 [(flyff.legacy_type) = "u32 objid"];
  sint32 param2 = 3 [(flyff.legacy_type) = "i32 nParam2"];
  sint32 param3 = 4 [(flyff.legacy_type) = "i32 nParam3"];
  // wand charge level 0..4
  sint32 magic_power = 5 [(flyff.legacy_type) = "i32 nMagicPower"];
  // replaces the legacy idSfxHit (Plan/11 section 8.3): the id the ProjectileSpawn of this attack will
  // carry
  uint32 projectile_id = 6 [(flyff.legacy_type) = "i32 idSfxHit"];
  // added (Plan/11 section 9.4): the sim frame at which the server started the action, so observers start
  // the swing in phase
  uint64 server_frame = 100 [(flyff.js_safe_number) = true];
  // added (Plan/11 section 8.6): the attacker animation speed (m_fAniSpeed) when the action started on the
  // server
  float ani_speed = 101;
}

// legacy RANGE_ATTACK 0x00E2 (S2C); obj_id: the attacker. Relay of a bow or yo-yo attack, also the ranged
// attack of a monster (ref/08 section 10.1; the legacy AddRangeAttack writes dwItemID as param2 and 0 as
// param3). Audience: near minus self.
message RangeAttackNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xE2
    name: "RANGE_ATTACK"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "17";
  option (flyff.milestone) = "M3";
  uint32 atk_msg = 1 [(flyff.legacy_type) = "u32 dwAtkMsg"];
  uint32 target = 2 [(flyff.legacy_type) = "u32 objid"];
  // the bow charge power 0..4 (players) or the weapon item id (monsters)
  uint32 item_id = 3 [(flyff.legacy_type) = "i32 nParam2"];
  // always 0
  sint32 param3 = 4 [(flyff.legacy_type) = "i32 nParam3"];
  // replaces the legacy idSfxHit (Plan/11 section 8.3)
  uint32 projectile_id = 5 [(flyff.legacy_type) = "i32 idSfxHit"];
  // added (Plan/11 section 9.4): the sim frame at which the server started the action, so observers start
  // the swing in phase
  uint64 server_frame = 100 [(flyff.js_safe_number) = true];
  // added (Plan/11 section 8.6): the attacker animation speed (m_fAniSpeed) when the action started on the
  // server
  float ani_speed = 101;
}

// legacy SP_ATTACK 0x00E3 (S2C); obj_id: the attacker. Monster special attack (SP_ATK1, ref/08 section
