// legacy SETSTUN 0x0059 (S2C); obj_id: the mover. A stun was applied or ended (ref/08 section 10.1, ref/09b
// section 3.1). Audience: near including self.
message SetStun {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x59
    name: "SETSTUN"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "17";
  option (flyff.milestone) = "M5";
  // > 0 starts the stun for that long, 0 ends it
  uint32 duration_ms = 1 [(flyff.legacy_type) = "i32 nMaxTime"];
}

// legacy DPS_UPDATE 0x8903 (S2C; custom __DPS_METER); obj_id: 0 (self). The damage meter of a boss fight
// (ref/08 section 10.1, Plan/17 section 10). The legacy multiplexed `mode` is the inner oneof.
message DpsUpdate {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x8903
    name: "DPS_UPDATE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "17";
  option (flyff.milestone) = "M5";
  // The legacy `i32 mode` selects the case; the field number is mode + 1 (Plan/11 section 5.2).
  oneof sub {
    // mode 0: the damage per second of every listed player (the only list the server sends)
    DpsList dps = 1;
    // mode 1: total damage plus the monster HP (never sent by the server, KEEP)
    DpsTotals totals = 2;
    // mode 2: show or hide the window
    DpsShow show = 3;
  }

  message DpsEntry {
    uint32 id_player = 1 [(flyff.legacy_type) = "u32"];
    string name = 2 [(flyff.legacy_type) = "str"];
    sint32 value = 3 [(flyff.legacy_type) = "i32"];
  }

  // mode 0
  message DpsList {
    repeated DpsEntry entries = 1 [(flyff.legacy_type) = "u32 n + n x {u32 idPlayer, str name, i32 nDPS}"];
  }

  // mode 1
  message DpsTotals {
    repeated DpsEntry entries = 1 [(flyff.legacy_type) = "u32 n + n x {u32 idPlayer, str name, i32 nDPSTotal}"];
    sint32 monster_total_hp = 2 [(flyff.legacy_type) = "i32"];
  }

  // mode 2
  message DpsShow {
    bool show = 1 [(flyff.legacy_type) = "i32 bShow"];
  }
}

// ext 0xFE000021; no legacy id (the legacy SFX_HIT / SFX_CLEAR client reports are dropped); obj_id: the
// attacker. A server projectile ended: it hit, timed out (10 s) or lost its target. It precedes the Damage
// it causes (Plan/11 G6). Audience: the same as ProjectileSpawn.
message ProjectileHit {
  option (flyff.ext_id) = 0xFE000021;
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "17";
  option (flyff.milestone) = "M3";
  uint32 projectile_id = 1;
  uint32 target_obj_id = 2;
  // impact position (hit SFX anchor)
  Vec3 pos = 3;
  uint64 server_frame = 4 [(flyff.js_safe_number) = true];
  // true: timeout (10 s) or the target vanished; remove without the hit SFX
  bool expired = 5;
}
