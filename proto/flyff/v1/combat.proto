  uint32 attacker = 1 [(flyff.legacy_type) = "u32 objidAttacker"];
  // the OBJMSG of the killing blow (OBJMSG_DAMAGE_FORCE 42 = fly-back death)
  uint32 attack_msg = 2 [(flyff.legacy_type) = "u32 dwMsg"];
}

