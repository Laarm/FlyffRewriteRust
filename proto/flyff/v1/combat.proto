// legacy MOVERDEATH 0x00C7 (S2C); obj_id: the dead mover. Sent after the last Damage and the final
// MoverStateNtf (Plan/11 G6, ref/08 section 10.2). Audience: near including self. The client zeroes HP and
// plays the death motion (ref/09a section 6.6); the own player opens the revival window.
message MoverDeath {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xC7
