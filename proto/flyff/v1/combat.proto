// Combat messages (Plan/11 sections 8.3, 8.6 and 9.4, WP-PROTO-12; tag block 192-223 plus the hot tags 4, 6, 8, 10,
// 11 and 14). Transcribed from ref/08 section 10, ref/07a sections 10 and 12, ref/07c section 4, ref/09a section
// 6.5/6.6, ref/20 section 7.4 and Plan/17 (message ownership in 17 section 0.2, behaviour in 3, 4, 5.17, 9).
//
// The final death pose is the MoverStateNtf of movement.proto (legacy MOVERBEHAVIOR2) followed by MoverDeath
// (Plan/11 G6). The SFX_ID / SFX_HIT / SFX_CLEAR client reports do not exist: the server simulates projectiles
// (Plan/11 section 8.3, D4). A fight-state notification is not a legacy message and has no counterpart here.
//
// AF_* attack flags (`atk_flags`, _AIInterface/ActionMover.h): GENERIC 0x1, MISS 0x2, RESERVED 0x4, MAGIC 0x8,
// MELEESKILL 0x10, MAGICSKILL 0x20, CRITICAL1 0x40 (x2.3), CRITICAL2 0x80 (x2.6), CRITICAL 0xC0, PUSH 0x100,
// PARRY 0x200, RESIST 0x400, STUN 0x800, BLOCKING 0x1000, FORCE 0x2000, RANGE 0x4000, MONSTER_SP_CLIENT 0x8000,
// FLYING 0x10000000 (knocked into the air; adds the defender position and angle).
//
// OBJMSG_* attack messages (`atk_msg`): ATK1 29, ATK2 30, ATK3 31, ATK4 32, SP_ATK1 33, SP_ATK2 34, ATK_RANGE1 35,
// ATK_MAGIC1 36 (the full list is in movement.proto).
syntax = "proto3";

package flyff.v1;

import "flyff/options.proto";
import "flyff/v1/common.proto";

// Behaviour classes of the server-simulated projectiles (ref/20 section 7.4, Plan/11 section 8.3).
enum ProjectileKind {
  PROJECTILE_KIND_UNSPECIFIED = 0;
  // CSfxShoot
  PROJECTILE_KIND_SHOOT = 1;
  // CSfxItemWandAtk1
  PROJECTILE_KIND_WAND_ATK1 = 2;
  // CSfxItemWandAtkAir (inertial)
  PROJECTILE_KIND_WAND_ATK_AIR = 3;
  // arrow
  PROJECTILE_KIND_RANGE_ATK1 = 4;
  PROJECTILE_KIND_RANGE_ATK_JUNKBOW = 5;
  PROJECTILE_KIND_MAG_STRONG_WIND = 6;
  PROJECTILE_KIND_MAG_SWORD_WIND = 7;
  PROJECTILE_KIND_MAG_FIRE_BOOMERANG = 8;
  PROJECTILE_KIND_MAG_ICE_MISSILE = 9;
  PROJECTILE_KIND_MAG_LIGHTNING_BALL = 10;
  PROJECTILE_KIND_MAG_SPIKE_STONE = 11;
  PROJECTILE_KIND_SHOOT_WAVE = 12;
  PROJECTILE_KIND_YOYO_ATK = 13;
  // fixed destination
  PROJECTILE_KIND_ATK_STRAIGHT = 14;
  // CSfxSkillMagHotAir (XI_SKILL_MAG_FIRE_HOTAIR01): attached to the attacker, no flight; the damage happens at
  // the hit frame and the client shows the effect only (Plan/17 section 4.3)
  PROJECTILE_KIND_MAG_HOT_AIR = 15;
}

// legacy MELEE_ATTACK 0x00FF0010 and MELEE_ATTACK2 0x00FF0014 (C2S), merged (Plan/11a R1-2, Plan/11 section
// 9.4): one melee swing request, ground or flying. VR-004: atk_msg must be ATK1..ATK4 (29..32). The server
// forces param2 to 0 and the low word of param3 to 0 so it always rolls hit and miss itself; a busy action
// queues the swing (ground and flying alike). Answer: MeleeAttackNtf to near minus self; the damage follows
// at the hit frame (Plan/17 sections 3.2, 3.7).
message MeleeAttackReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF0010
    name: "MELEE_ATTACK"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF0014
    name: "MELEE_ATTACK2"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "17";
  option (flyff.milestone) = "M3";
  // OBJMSG_ATK1..ATK4 = the combo step
  uint32 atk_msg = 1 [(flyff.legacy_type) = "u32 dwAtkMsg"];
  // target mover object id
  uint32 target = 2 [(flyff.legacy_type) = "u32 objid"];
  // the client sends MAKELONG(0, 0)
  sint32 param2 = 3 [(flyff.legacy_type) = "i32 nParam2"];
  // the client sends MAKELONG(0, result of its local SendActMsg)
  sint32 param3 = 4 [(flyff.legacy_type) = "i32 nParam3"];
  // dropped: fAttackSpeed (the __HACK_1023 weapon speed check, AC-07)
}

// legacy SETTARGET 0x00FF0023 (C2S): the focus target changed. Used for the kill-steal claim
// (CMover::IsSteal) and the party-skill target (ref/07a section 12.6, Plan/17 section 3.10). No reply.
message SetTargetReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF0023
    name: "SETTARGET"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "17";
  option (flyff.milestone) = "M3";
  uint32 target = 1 [(flyff.legacy_type) = "u32 idTarget"];
  // 0 claim the target (target.id_targeter = me when unclaimed), 1 release the claim (and cancel a Hero
  // Drawing cast), 2 remember it as the party-skill / queue target; any other value is dropped (VR-004)
  uint32 clear = 2 [(flyff.legacy_type) = "u8 bClear"];
}

// legacy MAGIC_ATTACK 0x00FF0011 (C2S): wand attack (ref/07a section 12.3, Plan/17 section 3.3). VR-004:
// atk_msg == ATK_MAGIC1 (36), magic_power 0..4; param2 is forced to 0. The wand charge is paid at power 3
// only (KQ-05). Answer: MagicAttackNtf; the damage happens when the server projectile arrives.
message MagicAttackReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF0011
    name: "MAGIC_ATTACK"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "17";
  option (flyff.milestone) = "M3";
  uint32 atk_msg = 1 [(flyff.legacy_type) = "u32 dwAtkMsg"];
  // target mover object id
  uint32 target = 2 [(flyff.legacy_type) = "u32 objid"];
  sint32 param2 = 3 [(flyff.legacy_type) = "i32 nParam2"];
  sint32 param3 = 4 [(flyff.legacy_type) = "i32 nParam3"];
  // wand charge level 0..4 (4 = full charge)
  sint32 magic_power = 5 [(flyff.legacy_type) = "i32 nMagicPower"];
  // dropped: idSfxHit (the client-chosen projectile id; the server allocates projectile_id, D4)
}

// legacy RANGE_ATTACK 0x00FF0012 (C2S): bow attack (ref/07a section 12.4, Plan/17 section 3.4). VR-004:
// atk_msg == ATK_RANGE1 (35), power 0..4. Answer: RangeAttackNtf; the damage happens when the server
// projectile arrives.
message RangeAttackReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF0012
    name: "RANGE_ATTACK"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "17";
  option (flyff.milestone) = "M3";
  uint32 atk_msg = 1 [(flyff.legacy_type) = "u32 dwAtkMsg"];
  // target mover object id
  uint32 target = 2 [(flyff.legacy_type) = "u32 objid"];
  // for players this is the bow charge power 0..4, not an item id
  uint32 item_id = 3 [(flyff.legacy_type) = "u32 dwItemID"];
  // dropped: idSfxHit (the client-chosen projectile id; the server allocates projectile_id, D4)
}

