// Couple, campus, honor title and cheering messages (Plan/11 section 4.2, WP-PROTO-30; tag block 816-847). Transcribed
// from ref/07b section 9.4, ref/07c sections 12.4, 26 and 29, ref/08 section 15.3, ref/09b sections 6.1, 6.2, 7.12 and
// 3.16, ref/14 sections 11-13 and Plan/21 sections 11-14. The records are Couple / Campus / CampusMember
// (social_types.proto). Campus member levels: 1 master, 2 pupil. Honor titles: 150 counters (MAX_HONOR_TITLE),
// index = title id. Every C2S message acts for the session character (VR-001).
syntax = "proto3";

package flyff.v1;

import "flyff/options.proto";
import "flyff/v1/social_types.proto";

// legacy PROPOSE 0x8FFFF000 (C2S): propose to a player (ref/07c section 26, Plan/21 section 11.3). The target
// must be online, not the player himself; the opposite sex unless same-sex couples are allowed; neither
// coupled; the cooldown must be over. Answer: ProposeResult to the target.
message Propose {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x8FFFF000
    name: "PROPOSE"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // the character name
  string target_name = 1 [
    (flyff.legacy_type) = "str<=41",
    (flyff.max_len) = 41
  ];
}

// legacy REFUSE 0x8FFFF001 (C2S): decline the pending proposal (ref/07c section 26, Plan/21 section 11.3). No
// payload.
message Refuse {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x8FFFF001
    name: "REFUSE"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
}

// legacy COUPLE 0x8FFFF002 (C2S): accept the pending proposal (ref/07c section 26, Plan/21 section 11.3). No
// payload. Answer: CoupleResult to both players.
message CoupleReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x8FFFF002
    name: "COUPLE"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
}

// legacy DECOUPLE 0x8FFFF003 (C2S): end the couple (ref/07c section 26, Plan/21 section 11.3). No payload.
// Answer: DecoupleResult to both players.
message Decouple {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x8FFFF003
    name: "DECOUPLE"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
}

// legacy CAMPUS_INVITE 0x88100121 (C2S): invite a player into a campus as master or pupil (ref/07c section 29,
// Plan/21 section 12.3). Answer: CampusInviteNtf to the target.
message CampusInviteReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x88100121
    name: "CAMPUS_INVITE"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // the invited player (character id)
  uint32 target = 1 [(flyff.legacy_type) = "u32 idTarget"];
}

// legacy CAMPUS_ACCEPT 0x88100122 (C2S): accept a campus invitation (ref/07c section 29, Plan/21 section
// 12.3). Needs a live invitation from that player (FIX VR-044). Answer: CampusUpdate to the members.
message CampusAccept {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x88100122
    name: "CAMPUS_ACCEPT"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // the player who invited (character id)
  uint32 requester = 1 [(flyff.legacy_type) = "u32 idRequest"];
}

// legacy CAMPUS_REFUSE 0x88100123 (C2S): decline a campus invitation (ref/07c section 29, Plan/21 section
// 12.3). The inviter is told by a DefinedText.
message CampusRefuse {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x88100123
    name: "CAMPUS_REFUSE"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // the player who invited (character id)
  uint32 requester = 1 [(flyff.legacy_type) = "u32 idRequest"];
}

// legacy CAMPUS_REMOVE_MEMBER 0x88100125 (C2S): the master removes a pupil, or a pupil leaves his master; the
// requester loses 5 campus points (ref/07c section 29, Plan/21 section 12.3). Answer: CampusUpdate or
// CampusRemove.
message CampusRemoveMember {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x88100125
    name: "CAMPUS_REMOVE_MEMBER"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // the member to remove (character id), above 0
  uint32 target = 1 [(flyff.legacy_type) = "u32 idTarget"];
}

// legacy HONOR_LIST_REQ 0x70004000 (C2S): ask for the honor title counters (ref/07c section 12.4, Plan/21
// section 13.3). No payload. Answer: HonorListAck.
message HonorListReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x70004000
    name: "HONOR_LIST_REQ"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
}

// legacy HONOR_CHANGE_REQ 0x70004001 (C2S): select an honor title, or clear it with -1 (ref/07c section 12.4,
// Plan/21 section 13.3). The title must exist and its counter must have reached the need. Answer:
// HonorChangeAck near the player.
message HonorChangeReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0x70004001
    name: "HONOR_CHANGE_REQ"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // title id 0..149, or -1 = no title
  sint32 id = 1 [(flyff.legacy_type) = "i32 nChange"];
}

// legacy CHEERING 0xFFFFFF7C (C2S): cheer another player (ref/07b section 9.4, Plan/21 section 14). The target
// must be a player in view (FIX VR-051) and the cheer points must not be used up. Answer: SetCheerParam to the
// cheerer.
message Cheering {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFFFFFF7C
    name: "CHEERING"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // object id of the cheered player
  uint32 target_obj = 1 [(flyff.legacy_type) = "u32 objid"];
}

// legacy COUPLE 0x9700 (S2C); obj_id: 0 (self). The couple record of the receiver, in the join batch
// (CCouple::Serialize; ref/08 section 15.3, ref/09b sections 6.1 and 7.12, Plan/21 section 11.5).
message CoupleNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x9700
    name: "COUPLE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // experience and the two partners
  Couple couple = 1 [(flyff.legacy_type) = "CCouple::Serialize"];
}

// legacy PROPOSE_RESULT 0x9701 (S2C); obj_id: 0 (self). A proposal for the receiver (ref/08 section 15.3,
// ref/09b section 6.1, Plan/21 section 11.3).
message ProposeResult {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x9701
    name: "PROPOSE_RESULT"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  uint32 proposer = 1 [(flyff.legacy_type) = "u32 idProposer"];
  // name of the proposer
  string name = 2 [(flyff.legacy_type) = "str<=42"];
}

// legacy COUPLE_RESULT 0x9703 (S2C); obj_id: 0 (self). A couple was formed (ref/08 section 15.3, ref/09b
// section 6.1, Plan/21 section 11.3).
message CoupleResult {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x9703
    name: "COUPLE_RESULT"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  uint32 partner = 1 [(flyff.legacy_type) = "u32 idPartner"];
  // name of the partner
  string name = 2 [(flyff.legacy_type) = "str<=42"];
}

// legacy DECOUPLE_RESULT 0x9704 (S2C); obj_id: 0 (self). The couple was ended (ref/08 section 15.3, ref/09b
// section 6.1, Plan/21 section 11.3). No payload.
message DecoupleResult {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x9704
    name: "DECOUPLE_RESULT"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
}

// legacy ADD_COUPLE_EXPERIENCE 0x9705 (S2C); obj_id: 0 (self). The couple gained experience (ref/08 section
// 15.3, ref/09b section 6.1, Plan/21 section 11.4).
message AddCoupleExperience {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x9705
    name: "ADD_COUPLE_EXPERIENCE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // experience gained, 1 per tick
  sint32 exp = 1 [(flyff.legacy_type) = "i32 exp"];
}

// legacy CAMPUS_INVITE 0x8830 (S2C); obj_id: 0 (self). A campus invitation for the receiver (ref/08 section
// 15.3, ref/07c section 29, Plan/21 section 12.3).
message CampusInviteNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x8830
    name: "CAMPUS_INVITE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  uint32 requester = 1 [(flyff.legacy_type) = "u32 idRequester"];
  // name of the inviter
  string name = 2 [(flyff.legacy_type) = "str<=42"];
}

// legacy CAMPUS_UPDATE 0x8831 (S2C); obj_id: 0 (self). The campus of the receiver changed, also in the join
// batch (CCampus::Serialize; ref/08 section 15.3, ref/09b sections 6.2 and 7.12, Plan/21 section 12.3).
message CampusUpdate {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x8831
    name: "CAMPUS_UPDATE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // the campus with its members
  Campus campus = 1 [(flyff.legacy_type) = "CCampus::Serialize"];
}

// legacy CAMPUS_REMOVE 0x8832 (S2C); obj_id: 0 (self). The campus was dissolved (ref/08 section 15.3, ref/09b
// section 6.2, Plan/21 section 12.3).
message CampusRemove {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x8832
    name: "CAMPUS_REMOVE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  uint32 id_campus = 1 [(flyff.legacy_type) = "u32"];
}

// legacy CAMPUS_UPDATE_POINT 0x8833 (S2C); obj_id: 0 (self). The campus points of the receiver (ref/08 section
// 15.3, ref/09b section 6.2, Plan/21 section 12.4).
message CampusUpdatePoint {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x8833
    name: "CAMPUS_UPDATE_POINT"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  sint32 point = 1 [(flyff.legacy_type) = "i32"];
}

// legacy HONOR_LIST_ACK 0x9300 (S2C); obj_id: 0 (self). The honor title counters (ref/07c section 12.4, ref/08
// section 15.3, Plan/21 section 13.3).
message HonorListAck {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x9300
    name: "HONOR_LIST_ACK"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // exactly 150 entries, index = title id
  repeated sint32 counters = 1 [(flyff.legacy_type) = "150 x i32"];
}

// legacy HONOR_CHANGE_ACK 0x9301 (S2C); obj_id: the player whose title changed. Announced to the players near,
// including the player (ref/07c section 12.4, Plan/21 section 13.3).
message HonorChangeAck {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x9301
    name: "HONOR_CHANGE_ACK"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // the selected title id, -1 = none
  sint32 id = 1 [(flyff.legacy_type) = "i32 nChange"];
}

// legacy SETCHEERPARAM 0x00B4 (S2C); obj_id: 0 (self). The cheer points of the receiver (ref/07b section 9.4,
// Plan/21 section 14).
message SetCheerParam {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xB4
    name: "SETCHEERPARAM"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // cheer points left, 0..3
  sint32 points = 1 [(flyff.legacy_type) = "i32"];
  // milliseconds until the next point
  uint32 rest_ms = 2 [(flyff.legacy_type) = "u32 restMs"];
  // true = a point was gained
  bool add = 3 [(flyff.legacy_type) = "BOOL bAdd"];
}
