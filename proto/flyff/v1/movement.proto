// Movement messages (Plan/11 sections 8.2 and 9, WP-PROTO-10; D4; tag block 112-143 plus the hot tags 1-5,
// 7 and 13). Transcribed from ref/07a section 11, ref/08 section 8 and Plan/18.
//
// Player movement is client-authoritative: the client sends timestamped state (PlayerMoveState), the server
// relays it to the observers (MoverStateNtf). NPC movement is server intents that carry an IntentStamp
// (server_frame + start state) plus a 1 Hz MoverKeyframe (Plan/18 section 5). The 22/35-frame legacy ghost
// constants and the QUERYGETPOS/GETPOS/QUERYGETDESTOBJ/GETDESTOBJ resync family do not exist.
//
// Constants used in the field comments (ref/08 section 8.3, `_Common/MoverMsg.h`):
//   OBJSTA_* `state` is a packed word, one value per group:
//     move   0x000000FF  NONE 0, STAND 1, STAND2 2, SIT 3, FMOVE 4, BMOVE 5, LEFT 6, RIGHT 7, PICKUP 8,
//                        LMOVE 9, RMOVE 0x0A, STOP_RUN 0x0B
//     turn   0x00000300  LTURN 0x100, RTURN 0x200
//     look   0x00000C00  LOOKUP 0x400, LOOKDOWN 0x800
//     jump   0x0000F000  FJUMP_READY 0x1000, FJUMP 0x2000, FFALL 0x3000, FLAND 0x4000, SJUMP1..4 0x5000..0x8000,
//                        BJUMP_READY 0x9000, BJUMP 0xA000, BFALL 0xB000, BLAND 0xC000
//     attack 0x00FF0000  ATK1..ATK4 0x10000..0x40000, ATK_MAGIC1 0x50000, ATK_RANGE1 0x60000, RANGE3 0x70000,
//                        RANGE4 0x80000, ATK_MELEESKILL 0x90000, ATK_RANGESKILL 0xA0000, ATK_CASTING1 0xB0000,
//                        ATK_CASTING2 0xC0000, ATK_MAGICSKILL 0xD0000, SP_ATK1 0x100000, SP_ATK2 0x200000
//     damage 0x0F000000  DMG 0x01000000, DMG_FLY 0x02000000, DMG_DIE 0x03000000, DMG_LIVE 0x06000000,
//                        DEAD 0x08000000, DISAPPEAR 0x09000000, RESURRECTION 0x0C000000
//     action 0xF0000000  COLLECT 0x10000000, APPEAR 0x20000000, APPEAR2 0x30000000, STUN 0x40000000
//   OBJSTAF_* `state_flags`: COMBAT 0x01, WALK 0x02, SIT 0x04, FLY 0x08, ACC 0x10, ETC 0x20, ACCTURN 0x40,
//     TURBO 0x80.
//   OBJMSG_* `obj_msg` (enum by position): NONE 0, FORWARD 1, BACKWARD 2, STAND 3, SITDOWN 4, STANDUP 5, STOP 6,
//     ASTOP 7, LTURN 8, RTURN 9, STOP_TURN 10, PICKUP 11, RESURRECTION 12, COLLECT 13, APPEAR 14, APPEAR2 15,
//     STUN 16, JUMP 17, MODE_COMBAT 18, MODE_PEACE 19, MODE_WALK 20, MODE_RUN 21, MODE_FLY 22, MODE_GROUND 23,
//     MODE_TURBO_ON 24, MODE_TURBO_OFF 25, MODE_TURN 26, ACC_START 27, ACC_STOP 28, ATK1 29, ATK2 30, ATK3 31,
//     ATK4 32, SP_ATK1 33, SP_ATK2 34, ATK_RANGE1 35, ATK_MAGIC1 36, MELEESKILL 37, MAGICSKILL 38,
//     MAGICCASTING 39, DIE 40, DAMAGE 41, DAMAGE_FORCE 42, LOOKUP 43, LOOKDOWN 44, STOP_LOOK 45, MOTION 46,
//     TURNMOVE 47, TURNMOVE2 48, BASE_RADY 49, TEMP 50, TEMP2 51, TEMP3 52, DESTPOS 53, DESTOBJ 54, FALL 55,
//     LFORWARD 56, RFORWARD 57, STOP_RUN 58.
syntax = "proto3";

package flyff.v1;

import "flyff/options.proto";
import "flyff/v1/common.proto";

// ext 0xFE000010 (C2S). Player state sample, merges the seven legacy PLAYERMOVED/BEHAVIOR/CORR(2)/ANGLE
// packets (MS and MS2 payloads). The server applies it (1 km sanity guard on the ground, Plan/18 section 4.1)
// and relays MoverStateNtf to near minus self (Plan/11 section 9.1).
message PlayerMoveState {
  option (flyff.ext_id) = 0xFE000010;
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFFFFFF01
    name: "PLAYERMOVED"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFFFFFF02
    name: "PLAYERBEHAVIOR"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFFFFFF05
    name: "PLAYERCORR"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFFFFFF03
    name: "PLAYERMOVED2"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFFFFFF04
    name: "PLAYERBEHAVIOR2"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFFFFFF06
    name: "PLAYERCORR2"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFFFFFF29
    name: "PLAYERANGLE"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M2";
  // MOVED / BEHAVIOR / CORR / ANGLE / PERIODIC (500 ms refresh while moving). UNSPECIFIED is rejected.
  // ANGLE (legacy PLAYERANGLE, flying steering) only carries pos, delta, angle and `fly`; the state, flags and
  // motion fields of an ANGLE message are zero and ignored.
  MoveReason reason = 1;
  // the CURRENT position (no 22/37-frame "PresupposePos" prediction)
  Vec3 pos = 2 [(flyff.legacy_type) = "vec3 v"];
  // per-frame velocity
  Vec3 delta = 3 [(flyff.legacy_type) = "vec3 vd"];
  // yaw, degrees
  float angle = 4 [(flyff.legacy_type) = "f32"];
  // OBJSTA_* word
  uint32 state = 5 [(flyff.legacy_type) = "u32 dwState"];
  // OBJSTAF_*
  uint32 state_flags = 6 [(flyff.legacy_type) = "u32 dwStateFlag"];
  // MTI_*
  uint32 motion = 7 [(flyff.legacy_type) = "u32 dwMotion"];
  sint32 motion_ex = 8 [(flyff.legacy_type) = "i32"];
  sint32 loop = 9 [(flyff.legacy_type) = "i32 nLoop"];
  uint32 motion_option = 10 [(flyff.legacy_type) = "u32 dwMotionOption"];
  // current animation frame (m_fFrameCurrent), D4 "frame"
  float motion_frame = 11;
  // client 60 Hz frame counter when sampled, D4 "client_frame"; replaces the legacy i64 nTickCount
  uint32 client_frame = 12 [(flyff.legacy_type) = "i64 nTickCount"];
  // present iff OBJSTAF_FLY (legacy MS2 extras)
  FlyState fly = 13;
  // per-session increasing counter (dedupe after re-attach, logs)
  uint32 seq = 14;
  // dropped: the legacy u8 nFrame prediction horizon of PLAYERMOVED2
}

// ext 0xFE000011 (S2C); obj_id: the mover. Relay of a player state to near minus self, or an NPC correction
// after collision/drop (suppressed while the NPC is in OBJSTA_DMG_FLY, KEEP-QUIRK), or a server-forced pose
// (cheer, proposal kneel, final death pose; reason BEHAVIOR to near including self). Merges the seven legacy
// MOVER* snapshots. Observers apply the state at `server_frame` and extrapolate
// min(server_frame_now - server_frame, 37) frames with the shared sim (Plan/11 section 9.2).
message MoverStateNtf {
  option (flyff.ext_id) = 0xFE000011;
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xCA
    name: "MOVERMOVED"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xCB
    name: "MOVERBEHAVIOR"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xC8
    name: "MOVERCORR"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xCC
    name: "MOVERMOVED2"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xCD
    name: "MOVERBEHAVIOR2"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xC9
    name: "MOVERCORR2"
  };
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xCE
    name: "MOVERANGLE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M2";
  MoveReason reason = 1;
  Vec3 pos = 2 [(flyff.legacy_type) = "vec3 v"];
  Vec3 delta = 3 [(flyff.legacy_type) = "vec3 vd"];
  // yaw, degrees
  float angle = 4 [(flyff.legacy_type) = "f32"];
  // OBJSTA_* word
  uint32 state = 5 [(flyff.legacy_type) = "u32"];
  // OBJSTAF_*
  uint32 state_flags = 6 [(flyff.legacy_type) = "u32"];
  // MTI_*
  uint32 motion = 7 [(flyff.legacy_type) = "u32"];
  sint32 motion_ex = 8 [(flyff.legacy_type) = "i32"];
  sint32 loop = 9 [(flyff.legacy_type) = "i32"];
  uint32 motion_option = 10 [(flyff.legacy_type) = "u32"];
  float motion_frame = 11;
  // the 60 Hz frame at which the state was valid (the converted client stamp for player relays)
  uint64 server_frame = 12 [
    (flyff.legacy_type) = "i64 nTickCount",
    (flyff.js_safe_number) = true
  ];
  // present iff OBJSTAF_FLY
  FlyState fly = 13;
}

// ext 0xFE000012 (S2C); obj_id: the mover. 1 Hz drift bound for moving NPCs and monsters with observers
// (every 15th tick, phase-staggered by obj_id % 15). The client snaps its simulated position when the error
// exceeds 0.5 world units, otherwise it blends with the /8 render filter (Plan/18 section 5.3).
message MoverKeyframe {
  option (flyff.ext_id) = 0xFE000012;
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M2";
  uint64 server_frame = 1 [(flyff.js_safe_number) = true];
  Vec3 pos = 2;
  // yaw, degrees
  float angle = 3;
  // OBJSTA_* word at server_frame
  uint32 state = 4;
}

// legacy upstream SNAPSHOT DESTPOS 0x00C1 (C2S): click-to-move. The client sends the pending destination at
// most every 30 frames unless forced (ref/07a section 11.9). `start` carries the client's state because player
// movement is client-authoritative; the server applies the 1 km guard to `pos` and `start.pos` and relays
// DestPosNtf to near minus self (Plan/11 section 9.3).
message DestPosReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xC1
    name: "DESTPOS"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M2";
  Vec3 pos = 1 [(flyff.legacy_type) = "vec3"];
  // walk forward (true) or backward to the destination
  bool forward = 2 [(flyff.legacy_type) = "u8"];
  // dropped: objidIAObj (the __IAOBJ0622 variant is inactive)
  ClientStamp start = 100;
}

// legacy DESTPOS 0x00C1 (S2C); obj_id: the mover. Click-to-move of other players and NPC/monster/pet AI
// destinations. The client sets the stamp's start state at stamp.server_frame, then fast-forwards
// server_frame_now - stamp.server_frame frames, capped at 120 (Plan/11 section 9.3).
message DestPosNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xC1
    name: "DESTPOS"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M2";
  Vec3 pos = 1 [(flyff.legacy_type) = "vec3"];
  bool forward = 2 [(flyff.legacy_type) = "u8"];
  // dropped: objidIAObj (inactive)
  IntentStamp stamp = 100;
}

// legacy PLAYERSETDESTOBJ 0xFFFFFF07 (C2S): walk to an object ("follow"). An identical consecutive target is
// ignored by the server (__TRAFIC_1222, a traffic rule kept as F-117).
message SetDestObjReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFFFFFF07
    name: "PLAYERSETDESTOBJ"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M2";
  uint32 target_obj_id = 1 [(flyff.legacy_type) = "u32 objid"];
  // stop distance
  float range = 2 [(flyff.legacy_type) = "f32 fRange"];
  ClientStamp start = 100;
}

// legacy MOVERSETDESTOBJ 0x00C2 (S2C); obj_id: the mover that chases `target_obj_id`.
message SetDestObjNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xC2
    name: "MOVERSETDESTOBJ"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M2";
  uint32 target_obj_id = 1 [(flyff.legacy_type) = "u32 objid"];
  float range = 2 [(flyff.legacy_type) = "f32"];
  IntentStamp stamp = 100;
}

// legacy DESTANGLE 0x00C3 (S2C); obj_id: the mover. AI turn in place.
message DestAngle {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xC3
    name: "DESTANGLE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M3";
  // yaw, degrees
  float angle = 1 [(flyff.legacy_type) = "f32"];
  // turn left
  bool left = 2 [(flyff.legacy_type) = "u8 bLeft"];
  IntentStamp stamp = 100;
}

// legacy SETMOVEPATTERN 0x00CF (S2C); obj_id: the mover. Flying-monster pattern moves (F-107). Milestone M3
// (Plan/11a revision R1-3).
message SetMovePattern {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xCF
    name: "SETMOVEPATTERN"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M3";
  sint32 pattern = 1 [(flyff.legacy_type) = "i32"];
  Vec3 pos = 2 [(flyff.legacy_type) = "vec3"];
  // yaw, degrees
  float angle = 3 [(flyff.legacy_type) = "f32"];
  // pitch, degrees
  float angle_x = 4 [(flyff.legacy_type) = "f32"];
  IntentStamp stamp = 100;
}

// legacy SET_SPEED_FACTOR 0x0118 (S2C, __AI_0509); obj_id: the mover.
message SetSpeedFactor {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x118
    name: "SET_SPEED_FACTOR"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M3";
  float factor = 1 [(flyff.legacy_type) = "f32"];
  IntentStamp stamp = 100;
}

// legacy MOTION_ARRIVE 0x00EE (S2C); obj_id: the mover. Patrol waypoint reached (never emitted in v1).
message MotionArrive {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xEE
    name: "MOTION_ARRIVE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M3";
  // OBJMSG_STOP_RUN or OBJMSG_STOP
  sint32 obj_msg = 1 [(flyff.legacy_type) = "i32 objMsg"];
}

// legacy SETPOS 0x0010 (S2C); obj_id: the teleported object. Same-world teleport and NPC warps (monster
// return-home and resync). To the moving player itself it is an urgent message followed by a flush.
message SetPos {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x10
    name: "SETPOS"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M2";
  Vec3 pos = 1 [(flyff.legacy_type) = "vec3"];
  IntentStamp stamp = 100;
}

// legacy PUSHPOWER 0x005F (S2C); obj_id: the pushed object. Knock-back (suppressed when the target is in
// OBJSTA_DMG_FLY_ALL or OBJSTA_STUN).
message PushPower {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x5F
    name: "PUSHPOWER"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M3";
  Vec3 pos = 1 [(flyff.legacy_type) = "vec3"];
  // yaw, degrees
  float angle = 2 [(flyff.legacy_type) = "f32"];
  float push_angle = 3 [(flyff.legacy_type) = "f32"];
  float power = 4 [(flyff.legacy_type) = "f32"];
  uint64 server_frame = 100 [(flyff.js_safe_number) = true];
}

// legacy SENDACTMSG 0x005C (S2C); obj_id: the mover. AI mode changes (OBJMSG_MODE_PEACE, OBJMSG_MODE_TURBO_OFF).
message SendActMsg {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x5C
    name: "SENDACTMSG"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M3";
  // OBJMSG_*
  sint32 obj_msg = 1 [(flyff.legacy_type) = "i32 objMsg"];
  bool is_fly = 2 [(flyff.legacy_type) = "i32 isFly"];
  sint32 p1 = 3 [(flyff.legacy_type) = "i32"];
  sint32 p2 = 4 [(flyff.legacy_type) = "i32"];
  sint32 p3 = 5 [(flyff.legacy_type) = "i32"];
}

// legacy MOTION 0x00FF0016 (C2S): sit down or stand up. The server whitelists OBJMSG_SITDOWN 4 and
// OBJMSG_STANDUP 5 (VR-004); anything else is answered with MotionNtf{obj_msg: 0}.
message MotionReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFF0016
    name: "MOTION"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M2";
  uint32 obj_msg = 1 [(flyff.legacy_type) = "u32 objMsg"];
}

// legacy MOTION 0x0098 (S2C); obj_id: the mover (self for a rejection). `obj_msg` 0 means the request was
// rejected (legacy AddMotionError).
message MotionNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x98
    name: "MOTION"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "18";
  option (flyff.milestone) = "M2";
  uint32 obj_msg = 1 [(flyff.legacy_type) = "u32 objMsg"];
  uint64 server_frame = 100 [(flyff.js_safe_number) = true];
}
