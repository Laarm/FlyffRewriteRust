  uint32 item_obj_id = 2 [(flyff.legacy_type) = "u32 itemObjId"];
  // count of the item, or the penya amount
  uint32 num = 3 [(flyff.legacy_type) = "u32"];
}

// legacy GUILDLOG_VIEW 0x0142 (S2C); obj_id: 0 (self). The guild bank log, newest first, at most 100 entries,
// answer of GuildLogViewReq (ref/08 section 12.6, ref/09b section 3.7, Plan/21 section 5.9).
message GuildLogViewNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x142
    name: "GUILDLOG_VIEW"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // 1 item added, 2 item removed, 3 penya added, 4 penya removed
  uint32 kind = 1 [(flyff.legacy_type) = "u8 type"];
  // dropped: n (i16, the list length)
  // log lines
  repeated Entry entries = 2 [(flyff.legacy_type) = "i16 n + entries"];

  // One log line.
  message Entry {
    // name of the member who acted
    string player = 1 [(flyff.legacy_type) = "str<=42"];
    // unix seconds of the action
    sint64 logged_at = 2 [
      (flyff.legacy_type) = "i32 nDate",
      (flyff.js_safe_number) = true
    ];
    // kinds 1 and 2: the item id; kinds 3 and 4: the penya amount (the legacy slot is shared)
    uint32 item_id = 3 [(flyff.legacy_type) = "i32 nItemID"];
    // kinds 1 and 2 only: the upgrade level; 0 for kinds 3 and 4
    sint32 ability_option = 4 [(flyff.legacy_type) = "i32 nItemAbilityOption"];
    // kinds 1 and 2 only: the stack count; 0 for kinds 3 and 4
    sint32 count = 5 [(flyff.legacy_type) = "i32 nItemCount"];
  }
}
