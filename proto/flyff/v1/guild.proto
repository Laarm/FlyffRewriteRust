  option (flyff.milestone) = "M6";
  // 1 = the receiver put it, 3 = a guild member with the bank open put it
  uint32 mode = 1 [(flyff.legacy_type) = "u8 mode"];
  // the stored item (object id = its bank slot)
  ItemElem item = 2 [(flyff.legacy_type) = "CItemElem"];
}

// legacy GETITEMGUILDBANK 0x00D4 (S2C); obj_id: 0 (self). Penya or an item left the guild bank (ref/08 section
// 12.6, ref/09a section 5.5, Plan/21 sections 5.8 and 5.9). The legacy `u8 mode` selects the payload; the
// field number is mode + 1 (Plan/11 section 5.2). Boxed in ServerMsg.
message GetItemGuildBankNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xD4
    name: "GETITEMGUILDBANK"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  oneof sub {
    // GUILD_PENYA_MINE_UPDATE 0
    PenyaMineUpdate penya_mine = 1;
    // GUILD_ITEM_MINE_UPDATE 1
    ItemMineUpdate item_mine = 2;
    // GUILD_PENYA_ALL_UPDATE 2
    PenyaAllUpdate penya_all = 3;
    // GUILD_ITEM_ALL_UPDATE 3
    ItemAllUpdate item_all = 4;
  }

  message PenyaMineUpdate {
    // penya taken out; the receiver's purse grows by it
    uint32 gold = 1 [(flyff.legacy_type) = "u32"];
    // the member who took it (or paid for the cloak)
    uint32 id_player = 2 [(flyff.legacy_type) = "u32"];
    // true = the penya paid for a guild cloak (no contribution change)
    bool cloak = 3 [(flyff.legacy_type) = "u8 cbCloak"];
  }

  message ItemMineUpdate {
    // the item taken out; it goes into the receiver's inventory and leaves the bank by its object id
    ItemElem item = 1 [(flyff.legacy_type) = "CItemElem"];
  }

  message PenyaAllUpdate {
    // penya another member took out
    uint32 gold = 1 [(flyff.legacy_type) = "u32"];
    uint32 id_player = 2 [(flyff.legacy_type) = "u32"];
    bool cloak = 3 [(flyff.legacy_type) = "u8 cbCloak"];
  }

  message ItemAllUpdate {
    // the item another member took out; only the bank changes
    ItemElem item = 1 [(flyff.legacy_type) = "CItemElem"];
  }
}

// legacy REMOVE_GUILD_BANK_ITEM 0x00F3 (S2C); obj_id: 0 (self). A game master removed penya or an item from
// the guild bank (ref/08 section 12.6, ref/09b section 3.7, Plan/21 section 5.9).
