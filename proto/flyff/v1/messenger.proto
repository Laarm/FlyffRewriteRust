// legacy TAG 0x00F7 (S2C); obj_id: 0 (self). The offline notes of the receiver, at most 20, oldest first, in
// the join batch (ref/08 section 14, ref/09b section 3.3, Plan/21 sections 3.5 and 9.6).
message Tag {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xF7
    name: "TAG"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // dropped: n (i16, the list length)
  // the undelivered notes
  repeated Note notes = 1 [(flyff.legacy_type) = "i16 n + n x {str, u32, str}"];

  // One offline note.
  message Note {
    // name of the sender
    string from_name = 1 [(flyff.legacy_type) = "str<=65"];
    // the day the note was left as the integer YYYYMMDD
    uint32 date = 2 [(flyff.legacy_type) = "u32 date"];
    string text = 3 [(flyff.legacy_type) = "str<=256"];
  }
}

// legacy INSERTTAG_RESULT 0xF000B008 (S2C); obj_id: 0 (self). The result of SendTag (ref/03 section 9.2,
// ref/09a section 5.11, Plan/21 section 9.6).
message InsertTagResult {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xF000B008
    name: "INSERTTAG_RESULT"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  // true = the note was stored; false = refused (blocked, mailbox of 20 full)
  bool ok = 1 [(flyff.legacy_type) = "u8 result"];
}

// legacy SUMMON 0x00ED (S2C); obj_id: 0 (self). The summon scroll multiplexer (ref/09b section 3.12, Plan/21
// section 4.11). The legacy `u8 sub` selects the payload; the field number is sub + 1: SOMMON_FRIEND 0,
// SOMMON_FRIEND_CONFIRM 1, SOMMON_PARTY_CONFIRM 16. The nested messages drop the SOMMON_ prefix (they would
// repeat the C2S names).
message Summon {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xED
    name: "SUMMON"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M6";
  oneof sub {
    // SOMMON_FRIEND 0
    Friend friend = 1;
    // SOMMON_FRIEND_CONFIRM 1
    FriendConfirm friend_confirm = 2;
    // SOMMON_PARTY_CONFIRM 16
    PartyConfirm party_confirm = 17;
  }

  // the scroll was used: the client asks for the friend's name and answers with SummonFriend
  message Friend {
    // MAKELONG(ITYPE_ITEM, inventory object id of the scroll)
    uint32 data = 1 [(flyff.legacy_type) = "u32"];
    // inventory object id of the scroll (the same id as the HIGH word of data)
    uint32 item_obj_id = 2 [(flyff.legacy_type) = "OBJID"];
  }

  message FriendConfirm {
    // object id of the summoner
    uint32 summoner_obj = 1 [(flyff.legacy_type) = "OBJID objid"];
    // the packed scroll word, echoed in the answer
    uint32 data = 2 [(flyff.legacy_type) = "u32 dwData"];
    string summoner_name = 3 [(flyff.legacy_type) = "str<=64"];
    // name of the world the friend is summoned to
    string world_name = 4 [(flyff.legacy_type) = "str<=128"];
  }

  message PartyConfirm {
    // object id of the party leader
    uint32 leader_obj = 1 [(flyff.legacy_type) = "OBJID objid"];
    // the packed scroll word, echoed in the answer
    uint32 data = 2 [(flyff.legacy_type) = "u32 dwData"];
    // name of the world the party is summoned to
    string world_name = 3 [(flyff.legacy_type) = "str<=256"];
  }
}
