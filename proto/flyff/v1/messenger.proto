// legacy QUERY_PLAYER_DATA 0x0141 (S2C); obj_id: 0 (NULL_ID). The name and data of a character (ref/08 section
// 13.2, ref/09b section 3.8, Plan/21 section 3.2); sent to the asker, and to everyone when a character logs in
// or changes level or job.
message QueryPlayerDataNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x141
    name: "QUERY_PLAYER_DATA"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "21";
  option (flyff.milestone) = "M5";
  uint32 id_player = 1 [(flyff.legacy_type) = "u32"];
  string name = 2 [(flyff.legacy_type) = "str<=42"];
  // job, level, sex, version and login
  PlayerData data = 3 [(flyff.legacy_type) = "raw sPlayerData"];
}

