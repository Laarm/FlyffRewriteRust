// legacy VISPET_ACTIVATE 0x8801 (S2C); obj_id: 0 (self). A vis pet was summoned or dismissed; the client
// ignores the header and applies it to itself (ref/08 section 15.1, ref/09b section 3.13, Plan/19 section
