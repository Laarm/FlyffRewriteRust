// Pet messages (Plan/11 section 4.2, WP-PROTO-18; tag block 480-511): system pets (eggs), feeding, tamer items,
// resurrection, egg transform, vis pets, the pet filter and the angel. Transcribed from ref/07c sections 6 and
// 11, ref/08 sections 9.1 and 15.1, ref/09b sections 3.13 and 7.7, ref/13 section 19 and Plan/19 sections 5.12
// and 13.
//
// A pet's data is `PetData` (item_types.proto) inside the egg / pet ItemElem. Pet levels PL_EGG 0, D 1, C 2, B
// 3, A 4, S 5. The summoned system pet is named by the inventory object id of its item (`item_obj_id`); other
// players only learn `MAKELONG(kind, level)` (`PetLevelup.pet_id`).
syntax = "proto3";

package flyff.v1;

import "flyff/options.proto";
import "flyff/v1/item_types.proto";

// legacy PET_RELEASE 0xF000F600 (C2S): dismiss the summoned system pet (ref/07c section 11, Plan/19 section
// 13.1). Needs an active pet (TID_GAME_PET_NOT_FOUND). No payload. Answer: PetReleaseNtf to near.
message PetReleaseReq {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xF000F600
    name: "PET_RELEASE"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
}

// legacy USE_PET_FEED 0xF000F601 (C2S): feed the summoned pet with a feed stack; the server uses as much of
// the stack as the pet needs (ref/07c section 11, Plan/19 section 13.4). Eggs cannot be fed with
// features.sys_petleveling_mobkill. Answer: PetSetExp (egg) or PetFeed (pet), UpdateItem,
// TID_GAME_PETFEED_S01.
message UsePetFeed {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xF000F601
    name: "USE_PET_FEED"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the feed item (inventory object id)
  uint32 feed_obj_id = 1 [(flyff.legacy_type) = "u32 dwFeedId"];
}

// legacy MAKE_PET_FEED 0xF000F605 (C2S): grind gems into pet feed with a feed maker or at the pet food mill
// NPC (ref/07c section 11, Plan/19 section 13.4). Answer: PetMill + CreateItem.
message MakePetFeed {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xF000F605
    name: "MAKE_PET_FEED"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the material item (a gem)
  uint32 material_obj_id = 1 [(flyff.legacy_type) = "u32 dwMaterialId"];
  // the II_SYS_SYS_FEED_MAKER item, NULL_ID = via the NPC (kept verbatim)
  uint32 tool_obj_id = 2 [(flyff.legacy_type) = "u32 dwToolId"];
  // the number of materials to grind (clamped to the stack)
  sint32 num = 3 [(flyff.legacy_type) = "i16 nNum"];
}

