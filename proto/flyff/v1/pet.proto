message PetState {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x115
    name: "PET_STATE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the pet item (inventory object id)
  uint32 item_obj_id = 1 [(flyff.legacy_type) = "u32 petItemObjId"];
  // the life
  uint32 life = 2 [(flyff.legacy_type) = "u16 wLife"];
  // the energy
  uint32 energy = 3 [(flyff.legacy_type) = "u16 wEnergy"];
  // the experience
  uint32 exp = 4 [(flyff.legacy_type) = "u32 dwExp"];
}

