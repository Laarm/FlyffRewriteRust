// legacy PETFILTER 0xAA000011 (C2S; repack __PET_FILTER): the loot categories the pet must skip (ref/07c
// section 11, Plan/19 sections 6.8 and 13.5). Held in memory only; the client resends it after every login.
message PetFilter {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xAA000011
    name: "PETFILTER"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // bit mask (Resource/defineFilter.h): 1 HPFOOD, 2 MPFOOD, 4 FPFOOD, 8 WEAPON, 16 ARMOR, 32 JEWELRY, 64 EGG,
  // 128 SUNSTONE, 256 MOONSTONE, 512 QUESTITEM, 1024 ELECARDS, 2048 SOCKETCARD; a set bit = skip
  uint32 filter = 1 [(flyff.legacy_type) = "u32 dwPetFilter"];
}

// legacy CREATEANGEL 0x00FFF000 (C2S): summon an angel from Orichalcum and moonstones (ref/07c section 6.1,
// Plan/19 section 5.12). FIX (ref/07c port note 4, Plan/11 section 5.5, VR-025): the legacy payload was ONE
// string built by the client, the concatenation of "<objid>D<count>DD" per material, parsed with an
// off-by-one buffer overflow; it is transcribed as a typed list. The handler checks (not generated limits):
// at most 20 entries, distinct ids, 1 <= count <= stack, only II_GEN_MAT_ORICHALCUM01/_1 and
// II_GEN_MAT_MOONSTONE/_1; a bad list is refused, not kicked. The colour of the angel is rolled from the
// total count (Plan/19 section 5.12).
message CreateAngel {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFFF000
    name: "CREATEANGEL"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the materials placed in the summon window (MAX_MATDIE 20 slots)
  repeated AngelMaterial materials = 1 [
    (flyff.legacy_type) = "str<=1024 \"<objid>D<count>DD\" ...",
    (flyff.max_len) = 20
  ];
}

// legacy ANGELBUFF 0x00FFF002 (C2S): redeem a finished angel buff for a 100 % angel item (ref/07c section
// 6.2, Plan/19 section 5.12). No payload.
message AngelBuff {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xFFF002
    name: "ANGELBUFF"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M5";
}

// legacy PET_CALL 0x0110 (S2C); obj_id: the owner. A pet was summoned; audience near including self (ref/08
// section 15.1, ref/09b section 3.13, Plan/19 section 13.1). The owner's client stores the item id; the
// others only kind and level.
message PetCall {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x110
    name: "PET_CALL"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the pet item (the owner's inventory object id)
  uint32 item_obj_id = 1 [(flyff.legacy_type) = "u32 petItemObjId"];
  // the pet's mover (model) index
  uint32 mover_index = 2 [(flyff.legacy_type) = "u32 petMoverIndex"];
  // PL_EGG 0 .. PL_S 5
  uint32 level = 3 [(flyff.legacy_type) = "u8 petLevel"];
  // the pet name, at most 16 bytes (MAX_PET_NAME 17 buffer)
  string name = 4 [(flyff.legacy_type) = "str<=16"];
}

// legacy PET_RELEASE 0x0111 (S2C); obj_id: the owner. The pet was dismissed; audience near including self
// (ref/08 section 15.1). No payload.
message PetReleaseNtf {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x111
    name: "PET_RELEASE"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
}

// legacy PET_LEVELUP 0x0112 (S2C); obj_id: the owner. The pet changed level (or stats); audience near without
