// legacy MOVER_CHANGESFX 0x8800 (S2C); obj_id: the mover (the pet owner). The effect attached to a vis pet
// changed; audience near (ref/08 section 15.1, Plan/19 section 13.5).
message MoverChangeSfx {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x8800
    name: "MOVER_CHANGESFX"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the XI_* effect id, 0 = none
  uint32 sfx_id = 1 [(flyff.legacy_type) = "u32 m_dwMoverSfxId"];
}

// legacy ANGEL 0x00B1 (S2C); obj_id: 0 (self). The angel experience of the player, sent whenever it changes
// (ref/08 section 15.3, ref/09b section 3.13, Plan/19 section 5.12). The legacy `u8 sub` has one live value:
// ANGEL_INFO 1 (ANGEL_WNDCREATE 0 is commented out in the client); it is kept as `state`.
message Angel {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0xB1
    name: "ANGEL"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M5";
  // ANGEL_INFO = 1, the only state the client handles
  uint32 state = 1 [(flyff.legacy_type) = "u8 nState"];
  // the angel experience
  sint64 angel_exp = 2 [
    (flyff.legacy_type) = "i64 m_nAngelExp",
    (flyff.js_safe_number) = true
  ];
  // the angel level
  sint32 angel_level = 3 [(flyff.legacy_type) = "i32 m_nAngelLevel"];
  // true = the angel is complete: the client prints TID_GAME_COMPLETE_ANGEL
  bool complete = 4 [(flyff.legacy_type) = "BOOL bComplete"];
}

// One material of CreateAngel.
message AngelMaterial {
  // the inventory object id of the material stack
  uint32 obj_id = 1 [(flyff.legacy_type) = "OBJID"];
  // how many units of that stack are used
  uint32 count = 2 [(flyff.legacy_type) = "int"];
}
