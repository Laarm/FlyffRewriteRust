  uint32 pet_id = 1 [(flyff.legacy_type) = "u32 petId"];
}

// legacy PET_SET_EXP 0x0113 (S2C); obj_id: 0 (self). The summoned pet's experience (ref/08 section 15.1,
// Plan/19 section 13.3).
message PetSetExp {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x113
    name: "PET_SET_EXP"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the experience (egg to 50000, pet to 100000)
  uint32 exp = 1 [(flyff.legacy_type) = "u32 dwExp"];
}

// legacy PET 0x0114 (S2C); obj_id: 0 (self). The whole pet data of the summoned pet item (ref/08 section
// 15.1, Plan/19 sections 13.1-13.4). The legacy CPet is `PetData` (item_types.proto).
message Pet {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_SNAPSHOTTYPE
    value: 0x114
    name: "PET"
  };
  option (flyff.dir) = DIRECTION_S2C;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the pet
  PetData pet = 1 [(flyff.legacy_type) = "CPet::Serialize"];
  // PF_PET 0 (first summon), PF_PET_LEVEL_UP 1, PF_PET_LEVEL_DOWN 2, PF_PET_GET_AVAIL 3
  uint32 flag = 2 [(flyff.legacy_type) = "u8 nPetLevelup"];
}

// legacy PET_STATE 0x0115 (S2C); obj_id: 0 (self). Life, energy and experience of the summoned pet, sent
