message PetTamerMistake {
  option (flyff.legacy_id) = {
    ns: LEGACY_NAMESPACE_PACKETTYPE
    value: 0xF000F602
    name: "PET_TAMER_MISTAKE"
  };
  option (flyff.dir) = DIRECTION_C2S;
  option (flyff.doc) = "19";
  option (flyff.milestone) = "M4";
  // the scroll item (inventory object id)
  uint32 obj_id = 1 [(flyff.legacy_type) = "u32 dwId"];
}

// legacy PET_TAMER_MIRACLE 0xF000F603 (C2S): the pet-tamer "miracle" scroll re-rolls the stats of the current
