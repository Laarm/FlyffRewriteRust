[package]
name = "npcscript-transpile"
description = "NpcScript.cpp -> content/npc/*.lua transpiler (Plan/20 §5, WP-NPC-03/04; not shipped)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "npcscript_transpile"
path = "src/lib.rs"

[[bin]]
name = "npcscript-transpile"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
flyff-common = { workspace = true }
flyff-vfs = { workspace = true }
flyff-script = { workspace = true }
flyff-data = { workspace = true, features = ["load"] }

