# The default quick locations of the live map (Plan/25 section 3.13, WP-ADMIN-14).
#
# Nothing in this file is a coordinate that a data file already knows. A row names WHERE its position comes from (`from`), and the server
# resolves it against the loaded game data when `GET /admin/api/locations` is asked (`crates/flyff-server/src/admin/api/locations.rs`):
#
#   kind = "teleport16"      name           the `teleport16.inc` row of that name (the "[Town] " tag in front is ignored)
#   kind = "region_pos"      world, title   the `vPos` of the titled region of that world's `.rgn`
#   kind = "portal_pos"      world, to      the `vPos` of the region of `world` that teleports to world `to` (a dungeon entrance)
#   kind = "portal_target"   world, to      the destination of that region (where a player arrives)
#   kind = "wld_camera"      world          the `camera` line of the world's `.wld`
#   kind = "party_dungeon"   world, monster the `SetMonster` position of that monster in `PartyDungeon.lua`
#   kind = "auto_raid"       name           the `SetPosition` of `AddRaid(name)` in `AutoRaid.lua`
#   kind = "revival"         world, key     the revival point of that key (`.rgn` revival regions)
#   kind = "dyo_npc"         world, key     the placement of the NPC with that `character.inc` key in the world's `.dyo`
#   kind = "const"           world, x, z, source   a constant of the original server code that no data file holds: `source` cites it
#                                                  (`src:<file under Source/>:<line>`), and every `const` row must have one
#
# The layer policy comes from the world (`pick_live` for the worlds the instance definitions use, 25 section 3.13): a row may say `policy` to
# override it. `zoom` is the scale a click flies to, in world units per pixel (2 = 1:2, about 1 km wide; 1 = 1:1); a row without one uses the
# `[zoom]` of its group, and a group without one fits the world (dungeons) or keeps the scale.
#
# A shared bookmark with the same group and name as a row here replaces it (that is how staff edit a default), see the Locations editor.
# The rows come out in this order; the groups in the order of their first row. Every world's `.wld` camera is added by the server as the group
# "All worlds".

[zoom]
Towns = 2.0
Fields = 2.0
Entrances = 1.0
Bosses = 1.0

