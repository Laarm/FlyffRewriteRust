[package]
name = "flyff-server"
description = "The `flyff` executable: CLI, config, thread bootstrap, axum HTTP/WS, lobby, admin, embedded web client (Plan/10, 12, 24; tier N)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "flyff_server"
path = "src/lib.rs"

[[example]]
name = "admin-dto"
required-features = ["ts"]

[[bin]]
name = "flyff"
path = "src/main.rs"

[features]
default = ["mimalloc"]
# `#[global_allocator] MiMalloc` (musl malloc is slow). Plan/02 §2.5.
mimalloc = ["dep:mimalloc"]
# rust-embed of the production web build (folder: $FLYFF_WEB_DIST_DIR, default web/dist) and of content/npc.
embed-web = ["dep:rust-embed"]
# Built-in TLS (rustls + PEM files, Plan/24). Wired by the HTTP WPs; the dependency set resolves already.
tls = ["dep:axum-server", "dep:rustls", "dep:rustls-pemfile"]
# ts-rs derives of the admin DTOs: `cargo xtask admin-dto` writes web/src/admin/gen/dto.ts (Plan/25 §11.10). Never shipped.
ts = ["dep:ts-rs"]

[dependencies]
flyff-common = { workspace = true, features = ["rt"] }
flyff-vfs = { workspace = true }
flyff-script = { workspace = true }
flyff-data = { workspace = true, features = ["load", "bundle"] }
flyff-formats = { workspace = true }
flyff-proto = { workspace = true }
flyff-db = { workspace = true }
flyff-game = { workspace = true }
flyff-rules = { workspace = true }
flyff-lua = { workspace = true }
flyff-assets = { workspace = true }
flyff-sim = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-util = { workspace = true, features = ["io"] }
axum = { workspace = true }
hyper = { workspace = true, features = ["http1", "http2", "server"] }
hyper-util = { workspace = true, features = ["tokio", "server-auto", "service", "http1", "http2"] }
http-body-util = { workspace = true }
tower = { workspace = true }
futures-util = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
flume = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
libc = { workspace = true }
mime_guess = { workspace = true }
parking_lot = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
xxhash-rust = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
qrcode = { workspace = true }
flate2 = { workspace = true }
rustix = { workspace = true, features = ["net"] }
mimalloc = { workspace = true, features = ["extended"], optional = true }
rust-embed = { workspace = true, optional = true }
axum-server = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
ts-rs = { workspace = true, optional = true }

