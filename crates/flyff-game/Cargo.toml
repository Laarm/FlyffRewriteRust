[package]
name = "flyff-game"
description = "Game thread: 15 Hz tick loop, worlds, systems; NO tokio/axum (Plan/10, 15-23; tier G)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
# the `Probe(PanicJob)` hook queues `PersistHandle::probe_write`s (WP-OPS-11).

[dependencies]
flyff-common = { workspace = true, features = ["rt"] }
flyff-vfs = { workspace = true }
flyff-script = { workspace = true }
flyff-formats = { workspace = true }
flyff-data = { workspace = true }
# `game`: RulesData::from_game_data (the stats environment, Plan/16 §18.2)
flyff-rules = { workspace = true, features = ["game"] }
flyff-sim = { workspace = true }
flyff-proto = { workspace = true }
flyff-db = { workspace = true }
flyff-lua = { workspace = true }
flume = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `persist::new_character`: the new-character template file (Plan/13 §24).
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
smallvec = { workspace = true }
slotmap = { workspace = true }
# 10 §5.5 / ADR-017: the single time-zone stack (tz database compiled into the binary).
chrono = { workspace = true }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }

