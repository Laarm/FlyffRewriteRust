# cargo-about configuration for the third-party notices of a release (Plan/02 §8.1). The dist step of
# `cargo xtask dist` currently writes LICENSES/THIRD-PARTY-RUST.txt from `cargo metadata`; this file
# configures `cargo about generate` when that tool is installed.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
targets = ["x86_64-unknown-linux-musl"]
