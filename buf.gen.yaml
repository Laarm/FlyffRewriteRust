# buf generate (Plan/02 section 5): TypeScript via protoc-gen-es v2 (the pnpm-installed package, so the
# generator version is pinned by web/pnpm-lock.yaml). Rust is generated by prost-build inside
# `cargo xtask gen-proto` from the descriptor set (no protoc, no build.rs).
version: v2
clean: true
inputs:
  - directory: proto
plugins:
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen/proto
    opt:
      - target=ts
      - import_extension=none
